# ============================================================
# Herta 角色风格模型
# ============================================================
name: "Herta"
version: "1.2.0"

# 只写和全局默认(models/_base.yml)不同的人设化行,其余命令自动沿用全局帮助
# #title/#version 等 # 开头的是帮助框的标题行与页脚行
help-overrides:
  "#title": "§b║ §2§oLengbanlist 帮助 - 黑塔风格 §b║"
  "lban add": "> 添加封禁，正义不容挑战！"
  "lban remove": "> 移除封禁，给予机会重新开始。"
  "ban-ip": "> 封禁 IP 地址，维护正义。"
  "lban mute": "> 禁言玩家，维护正义。"
  "lban unmute": "> 解除禁言，给予机会。"
  "lban warn": "> 警告玩家（4 次→14 天，5 次→永久黑塔数据封存！）"
  "kick": "> 踢出不听话的家伙！"
  "lban vanish": "> 隐身，把自己从你们的视野里删掉。"
  "lban freeze": "> 冻结玩家，把他钉在原地。"
  "lban unfreeze": "> 解除冻结，放开他。"
  "lban freeze list": "> 看看谁正被钉着。"
  "lban check": "> 检查封禁状态，黑塔的正义不容挑战！"
  "lban history": "> 翻翻黑历史，让黑塔瞧瞧~"
  "report": "> 维护正义，举报违规者！"
  "lban getip": "> 查询玩家 IP 地址，找出违规者。"
  "lban audit": "> 查看审计日志，黑塔的正义不容挑战！"
  "lban alts": "> 查询同IP小号，无非是些无聊的复制品！"
  "lban audit export": "> 导出审计日志，账本清清楚楚！"
  "lban audit verify": "> 校验审计完整性，谁动了手脚都瞒不过我！"
  "lban sync": "> 查看跨服同步状态，一切尽在掌控！"
  "lban rollback": "> 回滚操作，实验数据可以重来！"
  "lban list": "> 查看封禁名单，黑塔的正义不容挑战！"
  "lban a": "> 广播封禁人数，让违规者无处可逃！"
  "lban toggle": "> 开关自动广播，掌控一切！"
  "lban reload": "> 重新加载配置，确保一切正常运行。"
  "lban handle": "> 处理举报，黑塔亲自结案。"
  "lban admin": "> 打开管理员举报面板。"
  "lban tp": "> 传送至该玩家身边。"
  "setban": "§2✦ §b/setban <玩家名/IP> <时间/forever> <理由> §7- §3修订封期。"
  "#version": "§2♡ 当前版本: {version} §7| §b模型: 黑塔 Herta"

messages:
  get-kick-message: |-
    §5╔══════════════════════════╗
    §5║   §d黑塔的驱逐通知  §5║
    §5╠══════════════════════════╣
    §d☠️ 你被黑塔踢出服务器啦！
    
    §7原因: §f{reason}
    
    §d想回来记得找黑塔哦~
    §5╚══════════════════════════╝
  on-kick-success: |-
    §b✧ 黑塔说：§a{player} §e已被踢出！
    §5原因: §f{reason}
    §b调皮捣蛋可是要额外收费的~ §5(◕‿◕✿)
  toggle-broadcast: "§b黑塔说：§a自动广播已经 {enabled}！ 正义需要维护！"
  reload-config: "§b黑塔说：§a配置重新加载完成！一切正常运行。"
  add-ban: "§b黑塔说：§a玩家 {player} 已被封禁 {days}，原因是：{reason}。正义不容挑战！"
  remove-ban: "§b黑塔说：§a玩家 {player} 已从封禁名单中移除。给予机会，重新开始。"
  add-mute: "§b黑塔说：§a玩家 {player} 已被禁言，原因是：{reason}。正义不容挑战！"
  remove-mute: "§b黑塔说：§a玩家 {player} 的禁言已解除，可以继续说话了。"
  add-ban-ip: "§b黑塔说：§aIP {ip} 已被封禁 {days}，原因是：{reason}。正义不容挑战！"
  remove-ban-ip: "§b黑塔说：§aIP {ip} 的封禁已解除。给予机会，重新开始。"
  add-warn: "§b黑塔说：§a玩家 §e{player} §a因 §6{reason} §a被记一次警告。数据已记录，正义从不打折。"
  remove-warn: "§b黑塔说：§a玩家 {player} 的警告记录已移除。"
  mute-command-blocked: "§b黑塔说：§c禁言期间不能使用该命令，这种蠢问题也要来打扰天才？"
  warn-offline: "§b黑塔说：§a玩家 {player} 不在线，但警告已记录在案，原因是：{reason}。想逃出天才的视野？还早着呢。"
  pending-warnings-notice: "§b黑塔说：§e你有 {count} 条待处理警告。好好反省，我可没耐心重复第二遍。"
  expiry-reminder: "§b黑塔说：§e到期提醒：{target} 的{type}还剩 {remaining}。是否提前解除，你自己决定。"
  escalated-ban: "§b黑塔说：§e{player} 第 {count} 次违规，已自动升级封禁 {duration}。一犯再犯，真当我的实验台是游乐场？"
  alts-result: "§b黑塔说：§a{player} 名下查出 {count} 个同IP小号。无非是些无聊的复制品，怎么可能逃过我的眼睛？"
  no-alts: "§b黑塔说：§a{player} 没有查出同IP小号。还算干净，勉强值得一句表扬。"
  on-report-ban: "§b黑塔说：§a举报已确认，{player} 已被封禁 {duration}。这种小事，交给天才一秒就够了。"
  export-result: "§b黑塔说：§a审计日志导出完成，共 {count} 条。数据归档得井井有条，这才是天才该有的样子。"
  sync-status: "§b黑塔说：§e跨服同步状态：{detail}。所有数据都在我的掌控之中，同步绝不能出错。"
  immunity-denied: "§b黑塔说：§c哼，{target} 的权限等级可不比你低，想动他？先掂量掂量自己够不够格。"
  freeze-notify: "§c你已被管理员暂时冻结，理由：§f{reason}§c。别急，反正你也走不了。"
  freeze-title: "§c你已被冻结"
  freeze-subtitle: "§f理由：§e{reason}"
  freeze-reminder: "§c你正处于冻结状态，省点力气吧。"
  on-freeze: "§a{player} 已被冻结，理由：{reason}。"
  on-unfreeze: "§a{player} 的冻结已解除。"
  on-vanish: "§a隐身已{state}。"
  rollback-preview: "§b黑塔说：§e数据已拉取——操作人 {actor} 在 {time} 有 {matched} 条操作可以回滚。"
  rollback-result: "§b黑塔说：§a实验结果完美。回滚匹配 {matched} 条，执行 {executed} 条，跳过 {skipped} 条。"
  rollback-no-records: "§b黑塔说：§e{actor} 在那段时间根本没操作，白跑一趟~"
  history-empty: "§b黑塔说：§a{player} 的档案干干净净~看来是个遵纪守法的好孩子呢！"
  history-header: "§b黑塔说：§a让黑塔翻翻 "
  history-entry-format: "{entry}"
  history-footer: "§b黑塔说：§7调皮捣蛋可是要额外收费的~下次不许再犯哦！"
  verify-result-valid: "§b黑塔说：§a审计哈希链校验完整，共 {count} 条。没有异常，一切都在我的注视之下。"
  verify-result-invalid: "§b黑塔说：§c审计日志被篡改了！校验 {count} 条数据即发现异常。敢在天才的眼皮底下动手脚？"
