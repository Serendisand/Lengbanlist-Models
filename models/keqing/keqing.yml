# ============================================================
# Keqing 角色风格模型
# ============================================================
name: "Keqing"
version: "1.1.0"

# 只写和全局默认(models/_base.yml)不同的人设化行,其余命令自动沿用全局帮助
# #title/#version 等 # 开头的是帮助框的标题行与页脚行
help-overrides:
  "#title": "§b║ §2§oLengbanlist 帮助 - 刻晴风格 §b║"
  "lban add": "> 添加封禁，不守规矩就封了！"
  "lban remove": "> 移除封禁，知错能改善莫大焉！"
  "ban-ip": "> 封禁 IP 地址，刻晴绝不手软！"
  "lban mute": "> 禁言玩家，让他们安静一会儿！"
  "lban unmute": "> 解除禁言，让他们继续说话吧！"
  "lban warn": "> 警告玩家（4 次→14 天，5 次→永久，效率第一绝不拖沓！）"
  "kick": "> 踢出不守规矩的玩家！"
  "lban vanish": "> 隐身，我要静悄悄地办事。"
  "lban freeze": "> 冻结玩家，让他原地待命！"
  "lban unfreeze": "> 解除冻结，放他走。"
  "lban freeze list": "> 查看当前冻结名单。"
  "lban check": "> 检查封禁状态，刻晴办事效率第一！"
  "lban history": "> 调出处罚档案，一目了然！"
  "report": "> 发现违规行为？及时举报，刻晴会高效处理！"
  "lban getip": "> 查询玩家 IP 地址，看看谁在捣乱！"
  "lban audit": "> 查看审计日志，刻晴办事效率第一！"
  "lban alts": "> 查询同IP小号，一个都别想跑！"
  "lban audit export": "> 导出审计日志，数据归档要快！"
  "lban audit verify": "> 校验审计完整性，杜绝数据造假！"
  "lban sync": "> 查看跨服同步状态，效率第一！"
  "lban rollback": "> 回滚操作，及时纠错！"
  "lban models featured": "> 查看本月精选模型，刻晴已经审核过效率最高的！"
  "lban list": "> 查看封禁名单，刻晴办事效率第一！"
  "lban a": "> 广播封禁人数，让大家都知道！"
  "lban toggle": "> 开关自动广播，想听就开不想听就关！"
  "lban reload": "> 重新加载配置，效率第一绝不拖沓！"
  "lban handle": "> 处理举报，刻晴第一时间审核！"
  "lban admin": "> 打开管理员举报面板，玉衡星的督办面板！"
  "lban tp": "> 传送到该玩家身边，当场处理！"
  "setban": "§2✦ §b/setban <玩家名/IP> <时间/forever> <理由> §7- §3修改封禁时间，精准高效！"
  "#version": "§2♡ 当前版本: {version} §7| §b模型: 刻晴 Keqing"

messages:
  get-kick-message: |-
    §b╔══════════════════════════╗
    §b║   §d刻晴的驱逐通知  §b║
    §b╠══════════════════════════╣
    §d☠️ 你被刻晴踢出服务器啦！
    
    §7原因: §f{reason}
    
    §d下次请遵守规则哦~
    §b╚══════════════════════════╝
  on-kick-success: |-
    §b✧ 刻晴说：§a{player} §e已被踢出！
    §b原因: §f{reason}
    §b效率第一，刻晴办事！§b(◕‿◕✿)
  toggle-broadcast: "§b刻晴说：§a自动广播已经 {enabled}！ 让大家都知道规则的重要性！"
  reload-config: "§b刻晴说：§a配置重新加载完成！效率第一，刻晴办事，绝不拖沓！"
  add-ban: "§b刻晴说：§a{player} 已被封禁 {days}，原因是：{reason}！不守规矩，就别怪刻晴无情！"
  remove-ban: "§b刻晴说：§a{player} 已从封禁名单中移除。知错能改，善莫大焉！"
  add-mute: "§b刻晴说：§a{player} 已被禁言，原因是：{reason}！让他们安静一会儿吧！"
  remove-mute: "§b刻晴说：§a{player} 的禁言已解除，可以继续说话了！"
  add-ban-ip: "§b刻晴说：§aIP {ip} 已被封禁 {days}，原因是：{reason}！刻晴绝不手软！"
  remove-ban-ip: "§b刻晴说：§aIP {ip} 的封禁已解除。知错能改，善莫大焉！"
  add-warn: "§b刻晴说：§a玩家 §e{player} §a因 §6{reason} §a被记一次警告！不要再给玉衡星添乱了！"
  remove-warn: "§b刻晴说：§a玩家 {player} 的警告记录已移除。"
  mute-command-blocked: "§b刻晴说：§c禁言期间别想用命令！安静反省，效率为重，别浪费时间！"
  warn-offline: "§b刻晴说：§a{player} 不在线，警告已直接记录！原因是：{reason}。等他上线，刻晴第一时间跟进！"
  pending-warnings-notice: "§b刻晴说：§e注意！你有 {count} 条待处理警告，立刻整改，别再拖延！"
  expiry-reminder: "§b刻晴说：§e提醒：{target} 的{type}还剩 {remaining} 到期！提前安排，别误了进度！"
  escalated-ban: "§b刻晴说：§e{player} 第 {count} 次违规，系统自动升级封禁 {duration}！屡教不改，就该严办！"
  alts-result: "§b刻晴说：§a查到了！{player} 有 {count} 个同IP小号，一个都别想蒙混过关！"
  no-alts: "§b刻晴说：§a{player} 没有同IP小号，干净利落！"
  on-report-ban: "§b刻晴说：§a举报确认，封禁 {player} {duration}！刻晴办事，绝不手软！"
  export-result: "§b刻晴说：§a审计日志导出完成，共 {count} 条！归档完毕，随时可查！"
  sync-status: "§b刻晴说：§e跨服同步状态：{detail}！数据一致才有效率，绝不能拖后腿！"
  immunity-denied: "§b刻晴说：§c{target} 权限等级不低于你，这次行动不予批准。"
  freeze-notify: "§c你已被管理员暂时冻结，理由：§f{reason}§c。老实待着！"
  freeze-title: "§c你已被冻结"
  freeze-subtitle: "§f理由：§e{reason}"
  freeze-reminder: "§c你正处于冻结状态，别想乱动！"
  on-freeze: "§a{player} 已被冻结，理由是：{reason}！"
  on-unfreeze: "§a{player} 的冻结已解除。"
  on-vanish: "§a隐身已{state}。"
  rollback-preview: "§b刻晴说：§e已核算完毕——操作人 {actor} 在 {time} 有 {matched} 条操作待回滚。"
  rollback-result: "§b刻晴说：§a回滚完毕。匹配 {matched} 条，成功 {executed} 条，跳过 {skipped} 条。"
  rollback-no-records: "§b刻晴说：§e{actor} 在该时间段没有留下可回滚的记录。"
  history-empty: "§b刻晴说：§a系统查询完毕，{player} 档案清白，效率第一！"
  history-header: "{entry}"
  history-entry-format: "{entry}"
  history-footer: "§b刻晴说：§7查询完毕，希望此人不要再给玉衡星添乱！"
  verify-result-valid: "§b刻晴说：§a校验通过！共 {count} 条审计记录完整无损，效率与安全兼备！"
  verify-result-invalid: "§b刻晴说：§c校验失败！审计日志被动了手脚，共 {count} 条记录，必须立刻彻查！"
