messages:
  get-kick-message: |-
    §b╔══════════════════════════╗
    §b║   §d伊涅芙的驱逐通知  §b║
    §b╠══════════════════════════╣
    §d☠️ 连接已终止。执行者：伊涅芙

    §7判定原因: §f{reason}

    §d判定完成。请修正后重新接入~
    §b╚══════════════════════════╝
  on-kick-success: |-
    §b✧ 伊涅芙说：§a连接已终止——{player}
    §b判定原因: §f{reason}
    §b协议执行完毕。§b(◕‿◕✿)
  toggle-broadcast: "§b伊涅芙说：§a自动广播状态已更新为 {enabled}。指令已生效。"
  reload-config: "§b伊涅芙说：§a配置重载完成。所有模块运行正常。"
  add-ban: "§b伊涅芙说：§a{player} 已封禁，时长 {days}。判定依据：{reason}。执行完毕。"
  remove-ban: "§b伊涅芙说：§a{player} 的封禁已解除。该记录已归档。"
  add-mute: "§b伊涅芙说：§a{player} 的语音输出已切断。判定依据：{reason}。"
  remove-mute: "§b伊涅芙说：§a{player} 的语音输出已恢复。"
  add-ban-ip: "§b伊涅芙说：§a地址 {ip} 已封禁，时长 {days}。判定依据：{reason}。地址段锁定完毕。"
  remove-ban-ip: "§b伊涅芙说：§a地址 {ip} 的封禁已解除。该地址段已重新开放。"
  add-warn: "§b伊涅芙说：§a玩家 §e{player} §a记录一次警告。判定依据：§6{reason}§a。当前计数已更新。"
  remove-warn: "§b伊涅芙说：§a{player} 的警告记录已移除。计数已回退。"
