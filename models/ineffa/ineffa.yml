# ============================================================
# Ineffa 角色风格模型
# ============================================================
name: "Ineffa"
version: "1.2.1"

# 只写和全局默认(models/_base.yml)不同的人设化行,其余命令自动沿用全局帮助
# #title/#version 等 # 开头的是帮助框的标题行与页脚行
help-overrides:
  "#title": "§b║ §2§oLengbanlist 帮助 - 伊涅芙风格 §b║"
  "lban add": "> 添加封禁。判定完成，开始执行。"
  "lban remove": "> 移除封禁。封禁状态已解除。"
  "ban-ip": "> 封禁 IP 地址。地址段已锁定。"
  "lban mute": "> 禁言玩家。语音输出已切断。"
  "lban unmute": "> 解除禁言。语音输出已恢复。"
  "lban warn": "> 警告玩家（4 次→14 日，5 次→永封，阈值已设定）"
  "kick": "> 踢出违规玩家。连接已终止。"
  "lban vanish": "> 隐身模式。当前实体从其他玩家视野中移除。"
  "lban freeze": "> 冻结玩家，限制其位移与交互。"
  "lban unfreeze": "> 解除冻结，恢复其行动权限。"
  "lban freeze list": "> 列出当前冻结对象。"
  "lban check": "> 检查封禁状态。正在检索记录……"
  "lban history": "> 调取历史记录。档案已载入。"
  "report": "> 收到举报。已记录，待核验。"
  "lban audit": "> 查看审计日志。全部操作均有留痕。"
  "lban alts": "> 查询同IP小号。关联账号检索中……"
  "lban audit export": "> 导出审计日志。数据已封装。"
  "lban audit verify": "> 校验审计完整性。哈希链比对中……"
  "lban sync": "> 查看跨服同步状态。节点间通信中。"
  "lban rollback": "> 回滚操作。正在撤销变更。"
  "lban models featured": "> 查看本月精选模型。统计周期：本月。"
  "lban list": "> 查看封禁名单。列表生成完毕。"
  "lban a": "> 广播封禁人数。公告已推送。"
  "lban toggle": "> 开关自动广播。状态已切换。"
  "lban reload": "> 重新加载配置。模块重启完成。"
  "lban handle": "> 处理举报。正在执行裁定。"
  "lban admin": "> 打开管理员举报面板。待处理事项已列出。"
  "lban tp": "> 传送至该玩家身边。坐标已锁定。"
  "setban": "§2✦ §b/setban <玩家名/IP> <时间/forever> <理由> §7- §3修订封禁期限。参数已更新。"
  "#version": "§2♡ 当前版本: {version} §7| §b模型: 伊涅芙 Ineffa"

messages:
  get-kick-message: |-
    §b╔══════════════════════════╗
    §b║   §d伊涅芙的驱逐通知  §b║
    §b╠══════════════════════════╣
    §d☠️ 连接已终止。执行者：伊涅芙

    §7判定原因: §f{reason}

    §d判定完成。请修正后重新接入~
    §b╚══════════════════════════╝
  on-kick-success: |-
    §b✧ 伊涅芙说：§a连接已终止——{player}
    §b判定原因: §f{reason}
    §b协议执行完毕。§b(◕‿◕✿)
  toggle-broadcast: "§b伊涅芙说：§a自动广播状态已更新为 {enabled}。指令已生效。"
  reload-config: "§b伊涅芙说：§a配置重载完成。所有模块运行正常。"
  add-ban: "§b伊涅芙说：§a{player} 已封禁，时长 {days}。判定依据：{reason}。执行完毕。"
  remove-ban: "§b伊涅芙说：§a{player} 的封禁已解除。该记录已归档。"
  add-mute: "§b伊涅芙说：§a{player} 的语音输出已切断。判定依据：{reason}。"
  remove-mute: "§b伊涅芙说：§a{player} 的语音输出已恢复。"
  add-ban-ip: "§b伊涅芙说：§a地址 {ip} 已封禁，时长 {days}。判定依据：{reason}。地址段锁定完毕。"
  remove-ban-ip: "§b伊涅芙说：§a地址 {ip} 的封禁已解除。该地址段已重新开放。"
  add-warn: "§b伊涅芙说：§a玩家 §e{player} §a记录一次警告。判定依据：§6{reason}§a。当前计数已更新。"
  remove-warn: "§b伊涅芙说：§a{player} 的警告记录已移除。计数已回退。"
  mute-command-blocked: "§b伊涅芙说：§c该指令当前不可用。你的语音输出处于切断状态。"
  warn-offline: "§b伊涅芙说：§a{player} 当前离线，但记录不依赖在线状态。判定依据：{reason}。已入档，待其接入时告知。"
  pending-warnings-notice: "§b伊涅芙说：§e检测到你有 {count} 条未处理的警告。请留意。"
  expiry-reminder: "§b伊涅芙说：§e提醒：关于 {target} 的{type}，剩余 {remaining}。到期将自动解除。"
  escalated-ban: "§b伊涅芙说：§e检测到第 {count} 次违规。依据预设阈值，封禁已自动升级为 {duration}。"
  alts-result: "§b伊涅芙说：§a关联检索完成。{player} 名下共 {count} 个同 IP 账号。"
  no-alts: "§b伊涅芙说：§a关联检索完成。{player} 名下未发现同 IP 账号。"
  on-report-ban: "§b伊涅芙说：§a举报核验通过。{player} 已封禁 {duration}。感谢提供数据。"
  export-result: "§b伊涅芙说：§a审计日志导出完成，共 {count} 条。数据已封装。"
  sync-status: "§b伊涅芙说：§e跨服同步状态：{detail}。节点通信正常。"
  immunity-denied: "§b伊涅芙说：§c权限不足。{target} 的层级高于当前执行者，操作被拒绝。"
  freeze-notify: "§c你已被管理员暂时冻结，理由：§f{reason}§c。恢复正常前请勿尝试操作。"
  freeze-title: "§c你已被冻结"
  freeze-subtitle: "§f理由：§e{reason}"
  freeze-reminder: "§c你正处于冻结状态。操作已被拒绝。"
  on-freeze: "§a{player} 已冻结。判定依据：{reason}。"
  on-unfreeze: "§a{player} 的冻结已解除。"
  on-vanish: "§a隐身状态已{state}。"
  rollback-preview: "§b伊涅芙说：§e检索完成——{actor} 在 {time} 产生 {count} 条可回滚记录。是否继续？"
  rollback-result: "§b伊涅芙说：§a回滚执行完毕。匹配 {matched} 条，执行 {executed} 条，跳过 {skipped} 条。"
  rollback-no-records: "§b伊涅芙说：§e{actor} 在该时间段内没有可回滚的记录。"
  history-empty: "§b伊涅芙说：§a检索完成。{player} 的历史记录为空。"
  history-header: "§b伊涅芙说：§a调取档案——"
  history-entry-format: "{entry}"
  history-footer: "§b伊涅芙说：§7档案调取完毕。以上为全部记录。"
  verify-result-valid: "§b伊涅芙说：§a哈希链比对通过，{count} 条记录完整。数据可信。"
  verify-result-invalid: "§b伊涅芙说：§c比对失败。{count} 条记录存在篡改痕迹。建议立即核查。"
