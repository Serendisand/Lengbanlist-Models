# ============================================================
# Columbina 角色风格模型
# ============================================================
name: "Columbina"
version: "1.2.0"

# 只写和全局默认(models/_base.yml)不同的人设化行,其余命令自动沿用全局帮助
# #title/#version 等 # 开头的是帮助框的标题行与页脚行
help-overrides:
  "#title": "§b║ §2§oLengbanlist 帮助 - 哥伦比娅风格 §b║"
  "lban add": "> 添加封禁，让他做个长长的梦吧～"
  "lban remove": "> 移除封禁，梦该醒啦～"
  "ban-ip": "> 封禁 IP 地址，让这一整片都安静下来呢～"
  "lban mute": "> 禁言玩家，嘘——别吵醒大家哦～"
  "lban unmute": "> 解除禁言，可以说话啦～"
  "lban warn": "> 警告玩家（4 次→14 日，5 次→永封，晚安哦～）"
  "kick": "> 踢出不守规矩的玩家，去别处做梦吧～"
  "lban vanish": "> 隐入梦境，谁都看不见你～"
  "lban freeze": "> 把玩家冻结，让他睡一会儿，别动哦～"
  "lban unfreeze": "> 解除冻结，梦醒了～"
  "lban freeze list": "> 看看现在有谁在做梦。"
  "lban check": "> 检查封禁状态，看看谁还在梦里呢～"
  "lban history": "> 查阅梦境记录，我全都记得哦～"
  "report": "> 发现破坏秩序的行为？说给我听听呀～"
  "lban audit": "> 查看审计日志，都是些不会醒的故事呢～"
  "lban alts": "> 查询同IP小号，影子总待在一起呢～"
  "lban audit export": "> 导出审计日志，收进梦里～"
  "lban audit verify": "> 校验审计完整性，谁也别想偷偷改哦～"
  "lban sync": "> 查看跨服同步状态，梦与梦是相连的～"
  "lban rollback": "> 回滚操作，把做错的梦轻轻揉掉～"
  "lban models featured": "> 查看本月精选模型，这个月最甜的梦～"
  "lban list": "> 查看封禁名单，大家都睡着呢～"
  "lban a": "> 广播封禁人数，让所有人都听见这支摇篮曲～"
  "lban toggle": "> 开关自动广播，想听吗～"
  "lban reload": "> 重新加载配置，再做一个梦吧～"
  "lban handle": "> 处理举报，我会好好听的哦～"
  "lban admin": "> 打开管理员举报面板，好多故事等着我呢～"
  "lban tp": "> 传送至该玩家身边，来陪你一起睡～"
  "setban": "§2✦ §b/setban <玩家名/IP> <时间/forever> <理由> §7- §3修订封禁期限，梦有多长由我定～"
  "#version": "§2♡ 当前版本: {version} §7| §b模型: 哥伦比娅 Columbina"

messages:
  get-kick-message: |-
    §b╔══════════════════════════╗
    §b║   §d哥伦比娅的驱逐通知  §b║
    §b╠══════════════════════════╣
    §d☠️ 你被哥伦比娅踢出服务器啦～

    §7原因: §f{reason}

    §d困了就好好睡一觉吧，晚安哦~
    §b╚══════════════════════════╝
  on-kick-success: |-
    §b✧ 哥伦比娅说：§a{player} §e已经睡着啦～
    §b原因: §f{reason}
    §b做个好梦哦~§b(◕‿◕✿)
  toggle-broadcast: "§b哥伦比娅说：§a自动广播已经 {enabled}。要不要听着它入睡呢～"
  reload-config: "§b哥伦比娅说：§a配置重新加载完成啦。梦境又翻新了一遍呢～"
  add-ban: "§b哥伦比娅说：§a{player} 要睡上 {days} 了，原因是：{reason}。别担心，会做梦的哦～"
  remove-ban: "§b哥伦比娅说：§a{player} 的梦醒啦～该说早安了。"
  add-mute: "§b哥伦比娅说：§a{player} 的声音被收起来了，原因是：{reason}。安静一点，梦才甜嘛～"
  remove-mute: "§b哥伦比娅说：§a{player} 的声音还回去了哦～"
  add-ban-ip: "§b哥伦比娅说：§a{ip} 这一整片都要睡下啦，{days}，原因是：{reason}。整片都安静了呢～"
  remove-ban-ip: "§b哥伦比娅说：§a{ip} 醒了哦～天亮了。"
  add-warn: "§b哥伦比娅说：§a{player} 呀，因为 §6{reason} §a被记下了一次。再犯的话…就睡得更久一点哦～"
  remove-warn: "§b哥伦比娅说：§a{player} 的那一页，我撕掉了哦～"
  mute-command-blocked: "§b哥伦比娅说：§c嘘——你现在不能说话呢。安静地待一会儿吧～"
  warn-offline: "§b哥伦比娅说：§a{player} 虽然不在，但他做了什么我都看着哦，原因是：{reason}。等他回来就告诉他～"
  pending-warnings-notice: "§b哥伦比娅说：§e你还欠着 {count} 次没还呢。还清了，才能睡个安稳觉哦～"
  expiry-reminder: "§b哥伦比娅说：§e关于 {target} 的{type}，只剩 {remaining} 了哦。梦快到头啦，要醒了吗～"
  escalated-ban: "§b哥伦比娅说：§e{player} 已经是第 {count} 次了呢。这次就睡 {duration} 吧，反正你也不想醒～"
  alts-result: "§b哥伦比娅说：§a{player} 身后站着 {count} 个影子呢。影子从来都躲不掉的哦～"
  no-alts: "§b哥伦比娅说：§a{player} 身后空空的，一个影子也没有呢。真干净～"
  on-report-ban: "§b哥伦比娅说：§a有人把 {player} 的事说给我听了，那就睡 {duration} 吧。我听得可认真了～"
  export-result: "§b哥伦比娅说：§a把 {count} 条都收进梦里了，谁也拿不走哦～"
  sync-status: "§b哥伦比娅说：§e跨服同步状态：{detail}。梦和梦，本来就是连在一起的呀～"
  immunity-denied: "§b哥伦比娅说：§c{target} 的位置在你之上呢。打扰别人的梦，可不太好哦～"
  freeze-notify: "§c你已被管理员暂时冻结，理由：§f{reason}§c。别急，做个梦就好～"
  freeze-title: "§c你已被冻结"
  freeze-subtitle: "§f理由：§e{reason}"
  freeze-reminder: "§c你正处于冻结状态呢，先别乱动哦～"
  on-freeze: "§a{player} 已经睡下啦，理由是：{reason}。"
  on-unfreeze: "§a{player} 醒过来了。"
  on-vanish: "§a隐身已{state}。"
  rollback-preview: "§b哥伦比娅说：§e我看到啦——{actor} 在 {time} 留下了 {count} 条可以揉掉的痕迹呢～"
  rollback-result: "§b哥伦比娅说：§a揉掉啦～匹配 {matched} 条，改了 {executed} 条，跳过 {skipped} 条。"
  rollback-no-records: "§b哥伦比娅说：§e{actor} 在那段时间什么都没做过哦。空空的，像没做过梦一样～"
  history-empty: "§b哥伦比娅说：§a{player} 的梦里干干净净的，一条坏记录都没有呢～"
  history-header: "§b哥伦比娅说：§a让我看看 "
  history-entry-format: "{entry}"
  history-footer: "§b哥伦比娅说：§7一页一页都看完了哦。好好睡吧，别再做坏事啦～"
  verify-result-valid: "§b哥伦比娅说：§a{count} 条全都对得上呢，谁也没动过。真乖～"
  verify-result-invalid: "§b哥伦比娅说：§c{count} 条里有被人偷偷改过的痕迹哦…是谁呢？我会慢慢找出来的～"
