# ============================================================
# Varesa 角色风格模型
# ============================================================
name: "Varesa"
version: "1.2.2"

# 只写和全局默认(models/_base.yml)不同的人设化行,其余命令自动沿用全局帮助
# #title/#version 等 # 开头的是帮助框的标题行与页脚行
help-overrides:
  "#title": "§b║ §2§oLengbanlist 帮助 - 瓦雷莎风格 §b║"
  "lban add": "> 添加封禁！放心，我出手从来不手软！"
  "lban remove": "> 移除封禁！放你出来，下次可别再犯了！"
  "ban-ip": "> 封禁 IP 地址！一整片全都给我歇着！"
  "lban mute": "> 禁言玩家！先安静下来听我说！"
  "lban unmute": "> 解除禁言！好了，你可以说话了！"
  "lban warn": "> 警告玩家（4 次→14 日，5 次→永封，我可数得很准！）"
  "kick": "> 踢出捣乱的玩家！吃我一记！"
  "lban vanish": "> 隐身！把气息收住，谁都找不到你！"
  "lban freeze": "> 冻结玩家，先定在原地！"
  "lban unfreeze": "> 解冻！继续训练吧～"
  "lban freeze list": "> 看看谁被定住了！"
  "lban check": "> 检查封禁状态！让我看看是谁！"
  "lban history": "> 查看处罚记录！翻旧账我最在行啦！"
  "report": "> 发现捣乱的？快告诉我！我马上冲过去！"
  "lban audit": "> 查看审计日志！一笔一笔，谁也赖不掉！"
  "lban alts": "> 查询同IP小号！藏起来的小号我一样揪得出来！"
  "lban audit export": "> 导出审计日志！打包，收工！"
  "lban audit verify": "> 校验审计完整性！谁敢动一下试试！"
  "lban sync": "> 查看跨服同步状态！全服的消息我都收得到！"
  "lban rollback": "> 回滚操作！把错的那段一把掀掉！"
  "lban models featured": "> 查看本月精选模型！这个月谁最有人气？"
  "lban list": "> 查看封禁名单！名单挺长，一个一个数！"
  "lban a": "> 广播封禁人数！让全服都听见！"
  "lban toggle": "> 开关自动广播！啪一下就好！"
  "lban reload": "> 重新加载配置！刷新一下，精神百倍！"
  "lban handle": "> 处理举报！交给我，一分钟搞定！"
  "lban admin": "> 打开管理员举报面板！一堆事情等着我处理呢！"
  "lban tp": "> 传送至该玩家身边！等我，马上到！"
  "setban": "§2✦ §b/setban <玩家名/IP> <时间/forever> <理由> §7- §3修订封禁期限！改个数，简单！"
  "#version": "§2♡ 当前版本: {version} §7| §b模型: 瓦雷莎 Varesa"

messages:
  get-kick-message: |-
    §b╔══════════════════════════╗
    §b║   §d瓦雷莎的驱逐通知  §b║
    §b╠══════════════════════════╣
    §d☠️ 你被瓦雷莎一拳送出了服务器！

    §7原因: §f{reason}

    §d先去冷静一下，回头再来较量！
    §b╚══════════════════════════╝
  on-kick-success: |-
    §b✧ 瓦雷莎说：§a{player} §e已经被我请出去啦！
    §b原因: §f{reason}
    §b规则要记住哦！§b(◕‿◕✿)
  toggle-broadcast: "§b瓦雷莎说：§a自动广播已经 {enabled}！想听就开着呗！"
  reload-config: "§b瓦雷莎说：§a配置重新加载好了！状态满格！"
  add-ban: "§b瓦雷莎说：§a{player} 被封 {days}！原因是：{reason}。别怪我，规则就是规则！"
  remove-ban: "§b瓦雷莎说：§a{player} 解封啦！下次好好表现，我可看着呢！"
  add-mute: "§b瓦雷莎说：§a{player} 被禁言了！原因是：{reason}。先安静听我说两句！"
  remove-mute: "§b瓦雷莎说：§a{player} 可以说话了！别再乱讲了哦！"
  add-ban-ip: "§b瓦雷莎说：§aIP {ip} 被封 {days}！原因是：{reason}。整条线都给我停！"
  remove-ban-ip: "§b瓦雷莎说：§aIP {ip} 解封！通了通了！"
  add-warn: "§b瓦雷莎说：§a{player}！因为 §6{reason} §a吃了一次警告！我可给你数着呢！"
  remove-warn: "§b瓦雷莎说：§a{player} 的警告记录消掉了！这次就算了！"
  mute-command-blocked: "§b瓦雷莎说：§c禁言期间不能用这个啦！乖乖等着！"
  warn-offline: "§b瓦雷莎说：§a{player} 人不在，原因是：{reason}。不过账我记下了，跑不掉的！"
  pending-warnings-notice: "§b瓦雷莎说：§e你还欠 {count} 条警告没清呢！赶紧处理掉！"
  expiry-reminder: "§b瓦雷莎说：§e提醒一下！{target} 的{type}只剩 {remaining} 了，时间到了就自动解除！"
  escalated-ban: "§b瓦雷莎说：§e{player} 已经第 {count} 次了！按规矩直接升到 {duration}！我数得没错！"
  alts-result: "§b瓦雷莎说：§a查出来啦！{player} 有 {count} 个同 IP 的账号！一个都跑不掉！"
  no-alts: "§b瓦雷莎说：§a{player} 名下干净得很，一个同 IP 账号都没有！"
  on-report-ban: "§b瓦雷莎说：§a举报核实了！{player} 封 {duration}！谢谢你告诉我！"
  export-result: "§b瓦雷莎说：§a审计日志导出好啦，一共 {count} 条！装袋完成！"
  sync-status: "§b瓦雷莎说：§e跨服同步状态：{detail}。全服的动静我都听得到！"
  immunity-denied: "§b瓦雷莎说：§c{target} 的权限比你高！这个我动不了，换个人来吧！"
  freeze-notify: "§c你已被管理员暂时冻结，理由：§f{reason}§c。别乱动，先待着！"
  freeze-title: "§c你已被冻结"
  freeze-subtitle: "§f理由：§e{reason}"
  freeze-reminder: "§c你正处于冻结状态，动不了的！"
  on-freeze: "§a{player} 被冻结了！理由是：{reason}。"
  on-unfreeze: "§a{player} 解冻了，继续加油！"
  on-vanish: "§a隐身已{state}！"
  rollback-preview: "§b瓦雷莎说：§e找到啦——{actor} 在 {time} 留下 {count} 条可回滚的记录！要动手吗？"
  rollback-result: "§b瓦雷莎说：§a搞定！匹配 {matched} 条，执行 {executed} 条，跳过 {skipped} 条！"
  rollback-no-records: "§b瓦雷莎说：§e{actor} 那会儿什么也没留下，白跑一趟！"
  history-empty: "§b瓦雷莎说：§a{player} 的记录本干干净净，一条都没有！厉害！"
  history-header: "§b瓦雷莎说：§a我来翻翻——"
  history-entry-format: "{entry}"
  history-footer: "§b瓦雷莎说：§7看完了！以后继续保持，别再添新的啦！"
  verify-result-valid: "§b瓦雷莎说：§a{count} 条全都对得上！没人动过！漂亮！"
  verify-result-invalid: "§b瓦雷莎说：§c糟糕！{count} 条里面有人动过手脚！让我查出来是谁！"

# ---------- 控制台消息 ----------
# 插件自己在服务端控制台说的话（启动/关闭横幅等）；没写在这里的键沿用 models/_base.yml
console:
  ready: "§bLengbanlist §6热身完毕，随时可以开始！[]~(￣▽￣)~* §7v{version} §7| §3模型 {model} §7| §3服务端 {server}"
  loading: "§f原神§2正在加载，马上就好！"
  tip: "§6顺便告诉你: §e{tip}"
  placeholder-hook: "§aPlaceholderAPI 已接入，%lengbanlist_*% 随便用！"
  auto-update: "§a自动更新已开启，我去看看有没有新版本！"
  shutdown: "§k§4训练结束，正在收拾器材..."
  farewell: "§f今天练到这儿，下次继续！"
