# ============================================================
# Furina 角色风格模型
# ============================================================
name: "Furina"
version: "1.2.0"

# 只写和全局默认(models/_base.yml)不同的人设化行,其余命令自动沿用全局帮助
# #title/#version 等 # 开头的是帮助框的标题行与页脚行
help-overrides:
  "#title": "§b║ §2§oLengbanlist 帮助 - 芙宁娜风格 §b║"
  "lban add": "> 加入黑名单！"
  "lban remove": "> 从黑名单中移除"
  "ban-ip": "> 封禁 IP 地址，别再划水啦！"
  "lban mute": "> 禁言玩家，让他们安静一会儿！"
  "lban unmute": "> 解除禁言，可以继续说话啦！"
  "lban warn": "> 警告玩家（LBAC：4 次→14 天禁演，5 次→永久禁演！）"
  "kick": "> 踢出划水的家伙！"
  "lban vanish": "> 隐身，本神明退居幕后，你们都看不见我啦～"
  "lban freeze": "> 冻结玩家，给这场闹剧按个暂停键！"
  "lban unfreeze": "> 解除冻结，好戏继续上演～"
  "lban freeze list": "> 查看现在谁被按了暂停。"
  "lban history": "> 查阅审判记录，本水神亲自过目！"
  "report": "> 向本水神举报违规者！"
  "lban alts": "> 查询同IP小号，聚光灯下无所遁形！"
  "lban audit export": "> 导出审计日志，存档以备水神审阅！"
  "lban audit verify": "> 校验审计完整性，不容他人篡改剧本！"
  "lban sync": "> 查看跨服同步状态，水酱们时刻在线！"
  "lban rollback": "> 回滚操作，让剧情重演~"
  "lban models featured": "> 查看本月精选模型，本水神亲自点名表扬~"
  "lban list": "> 查看黑名单"
  "lban toggle": "> 开关自动广播，水酱们要注意啦！"
  "lban reload": "> 重新加载配置，水神的大脑又清晰啦！"
  "lban handle": "> 处理举报，本水神亲自结案！"
  "lban admin": "> 打开管理员举报面板，戏班子后台就在这~"
  "lban tp": "> 传送到该玩家身边，本水神驾临现场！"
  "setban": "§2✦ §b/setban <玩家名/IP> <时间/forever> <理由> §7- §3修改戏份时长"
  "#bottom": "§b╚══════════════════════════════════╗"
  "#version": "§2♡ 当前版本: {version} §7| §b模型: 芙宁娜 Furina"

messages:
  get-kick-message: |-
    §b╔══════════════════════════╗
    §b║   §d芙宁娜的驱逐通知  §b║
    §b╠══════════════════════════╣
    §d☠️ 你被芙宁娜踢出服务器啦！
    
    §7原因: §f{reason}
    
    §d下次请遵守规则哦~
    §b╚══════════════════════════╝
  on-kick-success: |-
    §b✧ 芙宁娜说：§a{player} §e已被踢出！
    §b原因: §f{reason}
    §b维护秩序，不容破坏！§b(◕‿◕✿)
  toggle-broadcast: "§b芙宁娜说：§a自动广播已经 {enabled}啦！ 水酱们要注意啦！"
  reload-config: "§b芙宁娜说：§a配置重新加载完成！水神的大脑又清晰啦！"
  add-ban: "§b芙宁娜说：§a{player} 已被加入黑名单！封禁 {days}，原因是：{reason}。划水可不是好习惯哦！"
  remove-ban: "§b芙宁娜说：§a{player} 已从黑名单中移除啦！知错能改，善莫大焉！"
  add-mute: "§b芙宁娜说：§a{player} 已被禁言，原因是：{reason}！让他们安静一会儿吧！"
  remove-mute: "§b芙宁娜说：§a{player} 的禁言已解除，可以继续说话啦！"
  add-ban-ip: "§b芙宁娜说：§aIP {ip} 已被封禁 {days}，原因是：{reason}。别再划水啦！"
  remove-ban-ip: "§b芙宁娜说：§aIP {ip} 的封禁已解除，给他们一个机会！"
  add-warn: "§b芙宁娜说：§a玩家 §e{player} §a因 §6{reason} §a被记一次警告！请不要再让本水神失望了~"
  remove-warn: "§b芙宁娜说：§a玩家 {player} 的警告记录已移除。"
  mute-command-blocked: "§b芙宁娜说：§c禁言期间还想动用命令？本水神的舞台，不欢迎不守规矩的观众！"
  warn-offline: "§b芙宁娜说：§a{player} 竟敢缺席，不过本水神的警告已然送达，原因是：{reason}。待他归来，再上演一场好戏吧！"
  pending-warnings-notice: "§b芙宁娜说：§e幕布即将拉开！你有 {count} 条待处理警告等待登场，请好好表现哦~"
  expiry-reminder: "§b芙宁娜说：§e演出提示：关于 {target} 的{type}，还有 {remaining} 便要落幕，请管理员做好准备！"
  escalated-ban: "§b芙宁娜说：§e好戏上演！{player} 第 {count} 次违规，自动升级封禁 {duration}！这般反复的表演，本水神已经看腻了！"
  alts-result: "§b芙宁娜说：§a本水神轻轻一挥手，便揪出了 {player} 的 {count} 个小号！聚光灯下，谁也藏不住~"
  no-alts: "§b芙宁娜说：§a{player} 名下并无小号，干净得像一张白纸，值得喝彩~"
  on-report-ban: "§b芙宁娜说：§a举报确认！本水神宣判：{player} 封禁 {duration}！退场吧，这场戏不再需要你了！"
  export-result: "§b芙宁娜说：§a审计日志导出完毕，共 {count} 条，本水神已尽数收入囊中，供后世品鉴~"
  sync-status: "§b芙宁娜说：§e跨服同步状态：{detail}。各服的水酱们，请配合本水神的演出~"
  immunity-denied: "§b芙宁娜说：§c哎哟~这场戏的主角 {target} 权限可不低呢，本神明可不能随意干涉！"
  freeze-notify: "§c你已被管理员暂时冻结，理由：§f{reason}§c。哼，先在这待着吧！"
  freeze-title: "§c你已被冻结"
  freeze-subtitle: "§f理由：§e{reason}"
  freeze-reminder: "§c你正处于冻结状态哦，本神明可没允许你动～"
  on-freeze: "§a{player} 已被冻结，理由是：{reason}。这出戏，暂停！"
  on-unfreeze: "§a{player} 已解除冻结，继续演出吧！"
  on-vanish: "§a隐身已{state}，本神明想低调一下～"
  rollback-preview: "§b芙宁娜说：§e哇哦~操作人 {actor} 在 {time} 的戏份有 {matched} 幕可以重演，准备好剧本了吗？"
  rollback-result: "§b芙宁娜说：§a完美谢幕！回滚匹配 {matched} 幕，成功 {executed} 幕，跳过 {skipped} 幕~"
  rollback-no-records: "§b芙宁娜说：§e{actor} 在那段时间没有登台记录，找无可找呢~"
  history-empty: "§b芙宁娜说：§a本水神查阅了 {player} 的记录，此人品行端正，毫无污点！值得嘉奖~"
  history-header: "§b芙宁娜说：§a咳咳，本水神在此宣判——以下是 "
  history-entry-format: "{entry}"
  history-footer: "§b芙宁娜说：§7审判结束！希望此人能改过自新，否则下次审判就不止于此了~"
  verify-result-valid: "§b芙宁娜说：§a审计哈希链完整无缺，共 {count} 条，本水神的账目滴水不漏！"
  verify-result-invalid: "§b芙宁娜说：§c竟有宵小胆敢篡改！审计日志已现破绽，共 {count} 条记录，本水神绝不轻饶！"
