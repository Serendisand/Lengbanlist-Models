# ============================================================
# Kirara 角色风格模型
# ============================================================
name: "Kirara"
version: "1.2.0"

# 只写和全局默认(models/_base.yml)不同的人设化行,其余命令自动沿用全局帮助
# #title/#version 等 # 开头的是帮助框的标题行与页脚行
help-overrides:
  "#title": "§b║ §2§oLengbanlist 帮助 - 绮良良风格 §b║"
  "lban add": "> 添加封禁！包裹先扣下了喵～"
  "lban remove": "> 移除封禁！包裹送到啦，签收一下喵～"
  "ban-ip": "> 封禁 IP 地址！这条路线封了喵～"
  "lban mute": "> 禁言玩家！先闭上嘴喵～"
  "lban unmute": "> 解除禁言！可以开口啦喵～"
  "lban warn": "> 警告玩家（4 次→14 日，5 次→永封，绮良良数得很准喵）"
  "kick": "> 踢出捣乱的玩家！不送啦喵～"
  "lban vanish": "> 隐身喵～包裹藏好，谁都找不到～"
  "lban freeze": "> 把玩家冻住喵，先别乱跑～"
  "lban unfreeze": "> 解冻啦喵，可以走了～"
  "lban freeze list": "> 看看有谁被扣着喵～"
  "lban check": "> 检查封禁状态！喵一下就知道～"
  "lban history": "> 查看处罚记录！翻翻旧单子喵～"
  "report": "> 发现捣乱的家伙？告诉我，我跑得可快啦喵～"
  "lban audit": "> 查看审计日志！每单都有签收记录的喵～"
  "lban alts": "> 查询同IP小号！同一个地址寄的，看得出来喵～"
  "lban audit export": "> 导出审计日志！打包发货～"
  "lban audit verify": "> 校验审计完整性！签收章有没有被仿造，我一看便知喵～"
  "lban sync": "> 查看跨服同步状态！别的分店也会传来消息喵～"
  "lban rollback": "> 回滚操作！这单退回重发喵～"
  "lban models featured": "> 查看本月精选模型！这个月哪件最畅销喵？"
  "lban list": "> 查看封禁名单！待派送的名单喵～"
  "lban a": "> 广播封禁人数！喊一声，全城都听得见喵～"
  "lban toggle": "> 开关自动广播！拨一下就好喵～"
  "lban reload": "> 重新加载配置！重新整理货架喵～"
  "lban handle": "> 处理举报！这单我接了喵～"
  "lban admin": "> 打开管理员举报面板！还有好多单没送呢喵～"
  "lban tp": "> 传送至该玩家身边！喵——这就到～"
  "setban": "§2✦ §b/setban <玩家名/IP> <时间/forever> <理由> §7- §3修订封禁期限！改一下日期喵～"
  "#version": "§2♡ 当前版本: {version} §7| §b模型: 绮良良 Kirara"

messages:
  get-kick-message: |-
    §b╔══════════════════════════╗
    §b║   §d绮良良的驱逐通知  §b║
    §b╠══════════════════════════╣
    §d☠️ 你被绮良良送出服务器了喵！

    §7原因: §f{reason}

    §d这单不送了，请自己走喵~
    §b╚══════════════════════════╝
  on-kick-success: |-
    §b✧ 绮良良说：§a{player} §e已经送出啦喵～
    §b原因: §f{reason}
    §b规矩要守好喵！§b(◕‿◕✿)
  toggle-broadcast: "§b绮良良说：§a自动广播已经 {enabled} 喵～拨一下就好啦！"
  reload-config: "§b绮良良说：§a配置重新加载好啦喵～货架整整齐齐的！"
  add-ban: "§b绮良良说：§a{player} 被封 {days} 了喵！原因是：{reason}。包裹先扣下啦～"
  remove-ban: "§b绮良良说：§a{player} 解封啦喵～包裹送达！"
  add-mute: "§b绮良良说：§a{player} 被禁言了喵，原因是：{reason}。先安静一下下～"
  remove-mute: "§b绮良良说：§a{player} 可以说话啦喵～"
  add-ban-ip: "§b绮良良说：§aIP {ip} 被封 {days} 了喵！原因是：{reason}。这条线不派送啦～"
  remove-ban-ip: "§b绮良良说：§aIP {ip} 解封喵～路线恢复了！"
  add-warn: "§b绮良良说：§a{player} 因为 §6{reason} §a被记了一次喵！绮良良记得可清楚啦～"
  remove-warn: "§b绮良良说：§a{player} 的警告擦掉啦喵～"
  mute-command-blocked: "§b绮良良说：§c禁言的时候不能用这个喵！再等等～"
  warn-offline: "§b绮良良说：§a{player} 现在不在喵，原因是：{reason}。不过单子我记下了，等他回来送过去！"
  pending-warnings-notice: "§b绮良良说：§e你还有 {count} 条警告没签收喵！快点处理掉～"
  expiry-reminder: "§b绮良良说：§e提醒你喵！{target} 的{type}只剩 {remaining} 了，到点会自动解除～"
  escalated-ban: "§b绮良良说：§e{player} 已经第 {count} 次了喵！按规矩升到 {duration}，我提醒过的！"
  alts-result: "§b绮良良说：§a查到啦喵！{player} 有 {count} 个同 IP 账号，同一个地址寄的～"
  no-alts: "§b绮良良说：§a{player} 名下没有同 IP 账号喵～干干净净的！"
  on-report-ban: "§b绮良良说：§a举报核实啦喵！{player} 封禁 {duration}。谢谢告诉我～"
  export-result: "§b绮良良说：§a审计日志导出好啦喵，一共 {count} 条！打包完成～"
  sync-status: "§b绮良良说：§e跨服同步状态：{detail}喵。别的分店也会传消息过来的～"
  immunity-denied: "§b绮良良说：§c{target} 的权限比你高喵！这个我动不了，换个人试试吧～"
  freeze-notify: "§c你已被管理员暂时冻结，理由：§f{reason}§c。包裹先扣下啦喵～"
  freeze-title: "§c你已被冻结"
  freeze-subtitle: "§f理由：§e{reason}"
  freeze-reminder: "§c你正处于冻结状态喵，先待着吧～"
  on-freeze: "§a{player} 被冻结了喵！理由是：{reason}。"
  on-unfreeze: "§a{player} 解冻了喵，一路顺风～"
  on-vanish: "§a隐身已{state}喵～"
  rollback-preview: "§b绮良良说：§e找到啦——{actor} 在 {time} 留下 {count} 条可以退回的单子喵！要退吗？"
  rollback-result: "§b绮良良说：§a退回处理完啦喵！匹配 {matched} 条，执行 {executed} 条，跳过 {skipped} 条～"
  rollback-no-records: "§b绮良良说：§e那段时间 {actor} 什么都没留下喵，白跑一趟～"
  history-empty: "§b绮良良说：§a{player} 的单子一张都没写喵！好乖～"
  history-header: "§b绮良良说：§a我来翻翻单子喵——"
  history-entry-format: "{entry}"
  history-footer: "§b绮良良说：§7都看完啦喵～以后别再让我记新的了哦！"
  verify-result-valid: "§b绮良良说：§a{count} 条全对得上喵！一个章都没被仿造～"
  verify-result-invalid: "§b绮良良说：§c糟糕喵！{count} 条里面有人动过手脚！绮良良这就去查！"
