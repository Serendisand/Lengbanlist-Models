# ============================================================
# Ayaka 角色风格模型
# ============================================================
name: "Ayaka"
version: "1.2.1"

# 只写和全局默认(models/_base.yml)不同的人设化行,其余命令自动沿用全局帮助
# #title/#version 等 # 开头的是帮助框的标题行与页脚行
help-overrides:
  "#title": "§b║ §2§oLengbanlist 帮助 - 绫华风格 §b║"
  "lban add": "> 添加封禁，维护秩序不容破坏。"
  "lban remove": "> 移除封禁，宽恕是美德。"
  "ban-ip": "> 封禁 IP 地址，维护秩序。"
  "lban mute": "> 禁言玩家，维护秩序。"
  "lban unmute": "> 解除禁言，给予机会重新开始。"
  "lban warn": "> 警告玩家（4 次→14 日，5 次→永封，以示薄惩）"
  "kick": "> 踢出不守规矩的玩家！"
  "lban vanish": "> 隐去身形，如白鹭入雾，无人可察。"
  "lban freeze": "> 冻结玩家，令其凝于原地，寸步难行。"
  "lban unfreeze": "> 解除冻结，还其自由之身。"
  "lban freeze list": "> 查看当前冻结名单。"
  "lban check": "> 检查封禁状态，优雅而公正。"
  "lban history": "> 查看处罚记录，请过目。"
  "report": "> 优雅地举报不守规矩的行为。"
  "lban audit": "> 查看审计日志，优雅而公正。"
  "lban alts": "> 查询同IP小号，请过目。"
  "lban audit export": "> 导出审计日志，留档以备查阅。"
  "lban audit verify": "> 校验审计完整性，一切尽在掌控。"
  "lban sync": "> 查看跨服同步状态，一切尽在掌控。"
  "lban rollback": "> 回滚操作，纠正当下之误。"
  "lban list": "> 查看封禁名单，优雅而公正。"
  "lban a": "> 广播封禁人数，让大家知晓规则。"
  "lban toggle": "> 开关自动广播，一切尽在掌控。"
  "lban reload": "> 重新加载配置，确保一切完美无缺。"
  "lban handle": "> 处理举报，审慎裁断。"
  "lban admin": "> 打开管理员举报面板，神里家的待办。"
  "lban tp": "> 传送至该玩家身边。"
  "setban": "§2✦ §b/setban <玩家名/IP> <时间/forever> <理由> §7- §3修订封期。"
  "#version": "§2♡ 当前版本: {version} §7| §b模型: 绫华 Ayaka"

messages:
  get-kick-message: |-
    §b╔══════════════════════════╗
    §b║   §d绫华的驱逐通知  §b║
    §b╠══════════════════════════╣
    §d☠️ 你被绫华踢出服务器啦！
    
    §7原因: §f{reason}
    
    §d下次请遵守规则哦~
    §b╚══════════════════════════╝
  on-kick-success: |-
    §b✧ 绫华说：§a{player} §e已被踢出！
    §b原因: §f{reason}
    §b维护秩序，不容破坏！§b(◕‿◕✿)
  toggle-broadcast: "§b绫华说：§a自动广播已经 {enabled}。 一切尽在掌控之中。"
  reload-config: "§b绫华说：§a配置重新加载完成。确保一切完美无缺。"
  add-ban: "§b绫华说：§a{player} 已被封禁 {days}，原因是：{reason}。维护秩序，不容破坏。"
  remove-ban: "§b绫华说：§a{player} 已从封禁名单中移除。宽恕是美德。"
  add-mute: "§b绫华说：§a{player} 已被禁言，原因是：{reason}。维护秩序，不容破坏。"
  remove-mute: "§b绫华说：§a{player} 的禁言已解除。给予机会，重新开始。"
  add-ban-ip: "§b绫华说：§aIP {ip} 已被封禁 {days}，原因是：{reason}。维护秩序，不容破坏。"
  remove-ban-ip: "§b绫华说：§aIP {ip} 的封禁已解除。给予机会，重新开始。"
  add-warn: "§b绫华说：§a玩家 §e{player} §a因 §6{reason} §a被记一次警告。请不要再让社奉行为难了。"
  remove-warn: "§b绫华说：§a玩家 {player} 的警告记录已移除。"
  mute-command-blocked: "§b绫华说：§c禁言期间无法使用该命令，还请您静心等候。"
  warn-offline: "§b绫华说：§a{player} 此刻不在线，警告已代为记下，原因是：{reason}。待他归来时请多加留意。"
  pending-warnings-notice: "§b绫华说：§e您有 {count} 条待处理的警告，还望多加注意。"
  expiry-reminder: "§b绫华说：§e{target} 的{type}将于 {remaining} 后到期，请阁下留意处理。"
  escalated-ban: "§b绫华说：§c{player} 已是第 {count} 次违规，系统已自动升级封禁至 {duration}。规矩面前，还请自律。"
  alts-result: "§b绫华说：§e经查，{player} 名下共有 {count} 个相同 IP 的账号，请酌情处理。"
  no-alts: "§b绫华说：§a{player} 名下未发现其他账号，一身清白。"
  on-report-ban: "§b绫华说：§a举报已确认，{player} 已被封禁 {duration}。感谢您为维护秩序所做的努力。"
  export-result: "§b绫华说：§a审计日志已成功导出，共 {count} 条记录，请过目。"
  sync-status: "§b绫华说：§a跨服同步状态：§f{detail}"
  immunity-denied: "§b绫华说：§c{target} 身份尊贵，恐非我等可轻易责罚，还请三思。"
  freeze-notify: "§c你已被管理员暂时冻结，理由：§f{reason}§c。请稍候，勿要挣扎。"
  freeze-title: "§c你已被冻结"
  freeze-subtitle: "§f理由：§e{reason}"
  freeze-reminder: "§c你正处于冻结状态，还请静候片刻。"
  on-freeze: "§a{player} 已被冻结，缘由是：{reason}。"
  on-unfreeze: "§a{player} 的冻结已解除。"
  on-vanish: "§a隐身已{state}。"
  rollback-preview: "§b绫华说：§e已清点完毕——操作人 {actor} 在 {time} 有 {matched} 条操作可待回滚。"
  rollback-result: "§b绫华说：§a回滚之事已办妥。匹配 {matched} 条，执行 {executed} 条，跳过 {skipped} 条。"
  rollback-no-records: "§b绫华说：§e{actor} 在那段时间并无需要回滚的记录。"
  history-empty: "§b绫华说：§a{player} 殿下的记录如白雪般纯净，绫华深感欣慰。"
  history-header: "{entry}"
  history-entry-format: "{entry}"
  history-footer: "§b绫华说：§7望阁下以此为戒，优雅地遵守规则，方显贵族风范。"
  verify-result-valid: "§b绫华说：§a审计完整性校验通过，{count} 条记录完好无损。"
  verify-result-invalid: "§b绫华说：§c校验未通过，{count} 条记录疑似被篡改，还请您及时核查。"
