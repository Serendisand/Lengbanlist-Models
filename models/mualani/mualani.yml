# ============================================================
# Mualani 角色风格模型
# ============================================================
name: "Mualani"
version: "1.2.2"

# 只写和全局默认(models/_base.yml)不同的人设化行,其余命令自动沿用全局帮助
# #title/#version 等 # 开头的是帮助框的标题行与页脚行
help-overrides:
  "#title": "§b║ §2§oLengbanlist 帮助 - 玛拉妮风格 §b║"
  "lban add": "> 添加封禁！先请他上岸歇几天～"
  "lban remove": "> 移除封禁！上岸啦，欢迎回来～"
  "ban-ip": "> 封禁 IP 地址！这片海域先关起来～"
  "lban mute": "> 禁言玩家！先潜到水下安静会儿～"
  "lban unmute": "> 解除禁言！浮上来吧，可以说话了～"
  "lban warn": "> 警告玩家（4 次→14 日，5 次→永封，我可有好好记着哦）"
  "kick": "> 踢出捣乱的玩家！冲浪板送你一程～"
  "lban vanish": "> 隐身～潜进水里，谁都看不见啦！"
  "lban freeze": "> 把玩家定住，先别冲啦！"
  "lban unfreeze": "> 解冻！可以继续玩啦～"
  "lban freeze list": "> 看看谁被定住了～"
  "lban check": "> 检查封禁状态！让我潜下去看看～"
  "lban history": "> 查看处罚记录！哗啦哗啦翻一翻～"
  "report": "> 发现捣乱的家伙？快说快说，我这就去！"
  "lban audit": "> 查看审计日志！每一笔都留着水痕呢～"
  "lban alts": "> 查询同IP小号！同一道浪打上来的，认得出！"
  "lban audit export": "> 导出审计日志！打包带走咯～"
  "lban audit verify": "> 校验审计完整性！有没有被搅浑，我一试就知道～"
  "lban sync": "> 查看跨服同步状态！海流会把消息带过去的～"
  "lban rollback": "> 回滚操作！把冲歪的那道浪收回来～"
  "lban models featured": "> 查看本月精选模型！这个月大家都在玩哪个呀？"
  "lban list": "> 查看封禁名单！一长串，游过去看看～"
  "lban a": "> 广播封禁人数！喊一嗓子，全海滩都听得见～"
  "lban toggle": "> 开关自动广播！啪一下，超简单～"
  "lban reload": "> 重新加载配置！浪花翻新啦～"
  "lban handle": "> 处理举报！交给我，游得快～"
  "lban admin": "> 打开管理员举报面板！排队的委托都在这儿～"
  "lban tp": "> 传送至该玩家身边！我踏浪过去～"
  "setban": "§2✦ §b/setban <玩家名/IP> <时间/forever> <理由> §7- §3修订封禁期限！划一道新的线～"
  "#version": "§2♡ 当前版本: {version} §7| §b模型: 玛拉妮 Mualani"

messages:
  get-kick-message: |-
    §b╔══════════════════════════╗
    §b║   §d玛拉妮的驱逐通知  §b║
    §b╠══════════════════════════╣
    §d☠️ 你被玛拉妮冲上了岸！

    §7原因: §f{reason}

    §d先上岸晒晒太阳，想明白了再来玩吧~
    §b╚══════════════════════════╝
  on-kick-success: |-
    §b✧ 玛拉妮说：§a{player} §e已经被我冲上岸啦！
    §b原因: §f{reason}
    §b规则要记牢哦！§b(◕‿◕✿)
  toggle-broadcast: "§b玛拉妮说：§a自动广播已经 {enabled} 啦！随时可以调～"
  reload-config: "§b玛拉妮说：§a配置重新加载好了！新的一波浪来咯～"
  add-ban: "§b玛拉妮说：§a{player} 被封禁 {days} 啦！原因是：{reason}。先在岸上歇着吧～"
  remove-ban: "§b玛拉妮说：§a{player} 解封了！欢迎回到水里～"
  add-mute: "§b玛拉妮说：§a{player} 被禁言了，原因是：{reason}。潜下去安静会儿～"
  remove-mute: "§b玛拉妮说：§a{player} 可以浮上来说话啦！"
  add-ban-ip: "§b玛拉妮说：§aIP {ip} 被封 {days} 啦！原因是：{reason}。这片海域先围起来～"
  remove-ban-ip: "§b玛拉妮说：§aIP {ip} 解封！海域重新开放咯～"
  add-warn: "§b玛拉妮说：§a{player} 因为 §6{reason} §a被记了一次！我记得可清楚了哦～"
  remove-warn: "§b玛拉妮说：§a{player} 的警告消掉了！那就当没发生过吧～"
  mute-command-blocked: "§b玛拉妮说：§c禁言的时候用不了这个啦！再等等～"
  warn-offline: "§b玛拉妮说：§a{player} 现在不在，原因是：{reason}。不过我记下啦，等他回来告诉他！"
  pending-warnings-notice: "§b玛拉妮说：§e你还欠 {count} 条警告没清哦！清完就轻松啦～"
  expiry-reminder: "§b玛拉妮说：§e提醒一下！{target} 的{type}只剩 {remaining} 啦，时间到了自动解除～"
  escalated-ban: "§b玛拉妮说：§e{player} 已经第 {count} 次了！按规矩自动升到 {duration}，我可提醒过哦！"
  alts-result: "§b玛拉妮说：§a查出来啦！{player} 有 {count} 个同 IP 账号，同一道浪打上来的～"
  no-alts: "§b玛拉妮说：§a{player} 名下干干净净，一个同 IP 账号都没有！"
  on-report-ban: "§b玛拉妮说：§a举报核实啦！{player} 封禁 {duration}。谢谢你告诉我～"
  export-result: "§b玛拉妮说：§a审计日志导出好啦，一共 {count} 条！打包完成～"
  sync-status: "§b玛拉妮说：§e跨服同步状态：{detail}。海流会把消息带过去的～"
  immunity-denied: "§b玛拉妮说：§c{target} 的权限比你高！这个我动不了呀，换个人吧～"
  freeze-notify: "§c你已被管理员暂时冻结，理由：§f{reason}§c。先歇会儿吧～"
  freeze-title: "§c你已被冻结"
  freeze-subtitle: "§f理由：§e{reason}"
  freeze-reminder: "§c你正处于冻结状态哦，先别冲了～"
  on-freeze: "§a{player} 被冻结啦！理由是：{reason}。"
  on-unfreeze: "§a{player} 解冻啦，继续冲浪吧～"
  on-vanish: "§a隐身已{state}～"
  rollback-preview: "§b玛拉妮说：§e找到啦——{actor} 在 {time} 留下 {count} 条可以收回的记录！要收吗？"
  rollback-result: "§b玛拉妮说：§a收好啦！匹配 {matched} 条，执行 {executed} 条，跳过 {skipped} 条～"
  rollback-no-records: "§b玛拉妮说：§e那段时间 {actor} 什么都没留下，白跑一趟咯～"
  history-empty: "§b玛拉妮说：§a{player} 的记录本一页都没写呢！好厉害～"
  history-header: "§b玛拉妮说：§a哗啦哗啦翻一翻——"
  history-entry-format: "{entry}"
  history-footer: "§b玛拉妮说：§7看完啦！以后别再让我添新页了哦～"
  verify-result-valid: "§b玛拉妮说：§a{count} 条全都对得上！一点都没被搅浑～"
  verify-result-invalid: "§b玛拉妮说：§c不好啦！{count} 条里面有人搅过水！得赶紧查查是谁～"

# ---------- 控制台消息 ----------
# 插件自己在服务端控制台说的话（启动/关闭横幅等）；没写在这里的键沿用 models/_base.yml
console:
  ready: "§bLengbanlist §6冲浪板就位，随时出发～[]~(￣▽￣)~* §7v{version} §7| §3模型 {model} §7| §3服务端 {server}"
  loading: "§f原神§2正在加载，玛拉妮马上冲上来啦～"
  tip: "§6海浪里飘来一句: §e{tip}"
  placeholder-hook: "§aPlaceholderAPI 接上啦，%lengbanlist_*% 都能用哦～"
  auto-update: "§a自动更新开着，我去看看有没有新版本～"
  shutdown: "§k§4要收摊啦，正在把板子拖上岸..."
  farewell: "§f今天浪够啦，下次再见～"
