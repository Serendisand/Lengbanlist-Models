name: "Nahida"

help:
  - "§b╔══════════════════════════════════╗"
  - "§b║ §2§oLengbanlist 帮助 - 纳西妲风格 §b║"
  - "§b╠══════════════════════════════════╣"
  - "§6§l◆ 处罚管理"
  - "§2✦ §b/lban add <可选>-s <必填>玩家名 <必填>天数 <必填>原因 §7- §3添加封禁，世界树会记下这次选择。"
  - "§7  = §b/ban"
  - "§2✦ §b/lban remove <必填>玩家名 §7- §3移除封禁，愿新的枝芽重新生长。"
  - "§7  = §b/unban"
  - "§2✦ §b/ban-ip <可选>-s <必填>IP地址 <必填>天数 <必填>原因 §7- §3封禁 IP 地址，异常的信息流需要修剪。"
  - "§2✦ §b/lban mute <可选>-s <必填>玩家名 <必填>原因 §7- §3禁言玩家，让思绪先安静下来吧。"
  - "§7  = §b/mute"
  - "§2✦ §b/lban unmute <可选>-s <必填>玩家名 §7- §3解除禁言，愿他们说出更温柔的话语。"
  - "§7  = §b/unmute"
  - "§2✦ §b/lban warn <必填>玩家名 <必填>原因 §7- §3警告玩家，三次警告将触发自动封禁。"
  - "§7  = §b/warn"
  - "§2✦ §b/lban unwarn <必填>玩家名 §7- §3移除玩家警告，让记录回归平静。"
  - "§7  = §b/unwarn"
  - "§2✦ §b/kick <必填>玩家名 <可选>原因 §7- §3踢出玩家，让他们暂时离开梦境。"
  - "§6§l◆ 查询信息"
  - "§2✦ §b/lban check <必填>玩家名/IP §7- §3检查封禁状态，读取世界树中的记录。"
  - "§2✦ §b/lban history <必填>玩家名 §7- §3查询处罚历史，看看记忆里留下了什么。"
  - "§7  = §b/history"
  - "§2✦ §b/report <必填>玩家名 <必填>原因 §7- §3举报玩家，把异常的梦告诉纳西妲吧。"
  - "§2✦ §b/lban getip <可选>玩家名 §7- §3查询玩家 IP 地址，追寻信息的源头。"
  - "§2✦ §b/lban alts <必填>玩家名 §7- §3查询同IP小号，看看梦境的另一端。"
  - "§2✦ §b/lban audit <可选>操作人 §7- §3查看审计日志，世界树的枝叶中藏着答案。"
  - "§2✦ §b/lban audit export §7- §3导出审计日志，把知识整理成册。"
  - "§2✦ §b/lban audit verify §7- §3校验审计完整性，确保记忆未被改写。"
  - "§2✦ §b/lban sync §7- §3查看跨服同步状态，看看知识如何流动。"
  - "§2✦ §b/lban rollback <操作人> <开始时间> <结束时间> <可选>操作类型 §7- §3回滚操作，修正知识的轨迹。"
  - "§6§l◆ 模型管理"
  - "§2✦ §b/lban models refresh §7- §3从云端拉取角色风格模型"
  - "§2✦ §b/lban models install <必填>ID §7- §3下载安装云端风格"
  - "§2✦ §b/lban models pin <必填>ID §7- §3锁定本地风格(云端不覆盖)"
  - "§2✦ §b/lban models unpin <必填>ID §7- §3解除锁定"
  - "§2✦ §b/lban models list §7- §3查看本地与云端模型"
  - "§6§l◆ 杂项"
  - "§2✦ §b/lban list §7- §3查看封禁名单，世界树的枝叶中藏着答案。"
  - "§2✦ §b/lban list-mute §7- §3查看禁言列表，安静也是一种思考。"
  - "§7  = §b/listmute"
  - "§2✦ §b/lban a §7- §3广播封禁人数，让大家共同守护规则。"
  - "§2✦ §b/lban toggle §7- §3开关自动广播，梦境的声音可以自由选择。"
  - "§2✦ §b/lban open §7- §3打开可视化操作界面。"
  - "§2✦ §b/lban model <必填>模型名称 §7- §3切换模型，去看看不同的梦吧。"
  - "§2✦ §b/lban reload §7- §3重新加载配置，让知识重新流动。"
  - "§2✦ §b/lban info §7- §3查看插件信息。"
  - "§b╚══════════════════════════════════╝"
  - "§2♡ 当前版本: {version} §7| §b模型: 纳西妲 Nahida"

