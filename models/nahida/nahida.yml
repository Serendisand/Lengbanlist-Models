# ============================================================
# Nahida 角色风格模型
# ============================================================
name: "Nahida"
version: "1.2.2"

# 只写和全局默认(models/_base.yml)不同的人设化行,其余命令自动沿用全局帮助
# #title/#version 等 # 开头的是帮助框的标题行与页脚行
help-overrides:
  "#title": "§b║ §2§oLengbanlist 帮助 - 纳西妲风格 §b║"
  "lban add": "> 添加封禁，世界树会记下这次选择。"
  "lban remove": "> 移除封禁，愿新的枝芽重新生长。"
  "ban-ip": "> 封禁 IP 地址，异常的信息流需要修剪。"
  "lban mute": "> 禁言玩家，让思绪先安静下来吧。"
  "lban unmute": "> 解除禁言，愿他们说出更温柔的话语。"
  "lban warn": "> 警告玩家（4 次→14 日，5 次→世界树永除其名）"
  "lban unwarn": "> 移除玩家警告，让记录回归平静。"
  "kick": "> 踢出玩家，让他们暂时离开梦境。"
  "lban vanish": "> 隐去身形，如藏在枝叶的影子里。"
  "lban freeze": "> 冻结玩家，让他暂时停在时间之外。"
  "lban unfreeze": "> 解除冻结，让他回到流动的时间里。"
  "lban freeze list": "> 看看此刻有谁停驻。"
  "lban check": "> 检查封禁状态，读取世界树中的记录。"
  "lban history": "> 查询处罚历史，看看记忆里留下了什么。"
  "report": "> 举报玩家，把异常的梦告诉纳西妲吧。"
  "lban getip": "> 查询玩家 IP 地址，追寻信息的源头。"
  "lban audit": "> 查看审计日志，世界树的枝叶中藏着答案。"
  "lban alts": "> 查询同IP小号，看看梦境的另一端。"
  "lban audit export": "> 导出审计日志，把知识整理成册。"
  "lban audit verify": "> 校验审计完整性，确保记忆未被改写。"
  "lban sync": "> 查看跨服同步状态，看看知识如何流动。"
  "lban rollback": "> 回滚操作，修正知识的轨迹。"
  "lban list": "> 查看封禁名单，世界树的枝叶中藏着答案。"
  "lban list-mute": "> 查看禁言列表，安静也是一种思考。"
  "lban a": "> 广播封禁人数，让大家共同守护规则。"
  "lban toggle": "> 开关自动广播，梦境的声音可以自由选择。"
  "lban open": "> 打开可视化操作界面。"
  "lban reload": "> 重新加载配置，让知识重新流动。"
  "lban info": "> 查看插件信息。"
  "lban handle": "> 处理举报，世界树会温柔地记住这个结果。"
  "lban admin": "> 打开管理员举报面板。"
  "lban tp": "> 传送至其身边。"
  "setban": "§2✦ §b/setban <玩家名/IP> <时间/forever> <理由> §7- §3修订世界树的记忆。"
  "#version": "§2♡ 当前版本: {version} §7| §b模型: 纳西妲 Nahida"

messages:
  get-kick-message: |-
    §b╔══════════════════════════╗
    §b║   §d纳西妲的梦境提醒  §b║
    §b╠══════════════════════════╣
    §d☘ 你暂时离开了这个梦境。
    
    §7原因: §f{reason}
    
    §d等你整理好思绪，再回来吧~
    §b╚══════════════════════════╝
  on-kick-success: |-
    §b✧ 纳西妲说：§a{player} §e已经暂时离开梦境。
    §b原因: §f{reason}
    §b愿这次提醒能让新的智慧发芽。§b(◕‿◕✿)
  toggle-broadcast: "§b纳西妲说：§a自动广播已经 {enabled}。 梦境的声音已经调整好了。"
  reload-config: "§b纳西妲说：§a配置重新加载完成。知识的脉络又变得清晰了。"
  add-ban: "§b纳西妲说：§a{player} 已被封禁 {days}，原因是：{reason}。世界树已经记录下这片异常的叶子。"
  remove-ban: "§b纳西妲说：§a{player} 已从封禁名单中移除。愿新的枝芽能向着阳光生长。"
  add-mute: "§b纳西妲说：§a{player} 已被禁言，原因是：{reason}。先让心中的杂音安静一会儿吧。"
  remove-mute: "§b纳西妲说：§a{player} 的禁言已解除。请用温柔的话语继续交流吧。"
  add-ban-ip: "§b纳西妲说：§aIP {ip} 已被封禁 {days}，原因是：{reason}。异常的信息流已经被暂时阻断。"
  remove-ban-ip: "§b纳西妲说：§aIP {ip} 的封禁已解除。愿它不再带来混乱的梦。"
  add-warn: "§b纳西妲说：§a玩家 §e{player} §a因 §6{reason} §a被记一次警告。世界树会记得，请不要再迷失了。"
  remove-warn: "§b纳西妲说：§a玩家 {player} 的警告记录已移除。愿这份空白能被更好的选择填满。"
  mute-command-blocked: "§b纳西妲说：§c禁言期间还不能使用这个命令哦，等思绪平静下来再说吧。"
  warn-offline: "§b纳西妲说：§a{player} 此刻不在梦境中，警告已先记在世界树上，原因是：{reason}。等他回来时再慢慢告诉他吧。"
  pending-warnings-notice: "§b纳西妲说：§e你还有 {count} 条待处理的警告哦，我们一起去面对它们，好吗？"
  expiry-reminder: "§b纳西妲说：§e{target} 的{type}还有 {remaining} 就要到期了，记得抽空处理一下哦。"
  escalated-ban: "§b纳西妲说：§c{player} 已是第 {count} 次触犯规则，世界树已自动将封禁升级为 {duration}。希望这次，他能学会与规则温柔相处。"
  alts-result: "§b纳西妲说：§e我在世界树里数了数，{player} 名下共有 {count} 个相同 IP 的账号，像是同一片叶子的投影。"
  no-alts: "§b纳西妲说：§a我在世界树中没有找到 {player} 的其他账号，他是一棵独立生长的小树苗。"
  on-report-ban: "§b纳西妲说：§a举报已经确认，{player} 已被封禁 {duration}。谢谢你守护了这片梦境。"
  export-result: "§b纳西妲说：§a审计日志已成功导出，共 {count} 条记录，都整理得清清楚楚啦。"
  sync-status: "§b纳西妲说：§a跨服同步状态：§f{detail}"
  immunity-denied: "§b纳西妲说：§c{target} 与你的位阶相当或更高，此刻出手并非明智之选。"
  freeze-notify: "§c你已被管理员暂时冻结，理由：§f{reason}§c。别怕，只是暂时停下来而已。"
  freeze-title: "§c你已被冻结"
  freeze-subtitle: "§f理由：§e{reason}"
  freeze-reminder: "§c你正处于冻结状态，静待片刻便好。"
  on-freeze: "§a{player} 已被冻结，缘由是：{reason}。世界树记下了这一刻。"
  on-unfreeze: "§a{player} 的冻结已解除，时间重新流动。"
  on-vanish: "§a隐身已{state}。"
  rollback-preview: "§b纳西妲说：§e梦境之中，我看到操作人 {actor} 在 {time} 有 {matched} 条操作可以回滚哦~"
  rollback-result: "§b纳西妲说：§a梦境已修正。回滚匹配 {matched} 条，执行 {executed} 条，跳过 {skipped} 条~"
  rollback-no-records: "§b纳西妲说：§e{actor} 在那段时间的梦境很干净，没有可回滚的记录呢~"
  history-empty: "§b纳西妲说：§a我查阅了世界树的记忆，{player} 没有任何处罚记录，是一片干净而温柔的叶子。"
  history-header: "§b纳西妲说：§a我从世界树中找到了 "
  history-entry-format: "{entry}"
  history-footer: "§b纳西妲说：§7记忆不会责备任何人，但它会提醒我们做出更好的选择。"
  verify-result-valid: "§b纳西妲说：§a校验通过，{count} 条记录与世界树的记忆完全一致，一切安好。"
  verify-result-invalid: "§b纳西妲说：§c校验发现了问题，{count} 条记录与世界树的记忆对不上，像是被什么悄悄改动过。"

# ---------- 控制台消息 ----------
# 插件自己在服务端控制台说的话（启动/关闭横幅等）；没写在这里的键沿用 models/_base.yml
console:
  ready: "§bLengbanlist §6一切都记下了，可以开始了。[]~(￣▽￣)~* §7v{version} §7| §3模型 {model} §7| §3服务端 {server}"
  loading: "§f原神§2正在加载，世界树舒展叶脉中"
  tip: "§6树梢上飘来一句话: §e{tip}"
  placeholder-hook: "§aPlaceholderAPI 已接入，%lengbanlist_*% 可用"
  auto-update: "§a自动更新已启用，正在查看新的枝叶"
  shutdown: "§k§4夜色将至，正在收拾梦境..."
  farewell: "§f愿下次醒来，我们仍在此相遇。"
