# ============================================================
# Skirk 角色风格模型
# ============================================================
name: "Skirk"
version: "1.2.2"

# 只写和全局默认(models/_base.yml)不同的人设化行,其余命令自动沿用全局帮助
# #title/#version 等 # 开头的是帮助框的标题行与页脚行
help-overrides:
  "#title": "§b║ §2§oLengbanlist 帮助 - 丝柯克风格 §b║"
  "lban add": "> 添加封禁。杂鱼就该待在笼子里。"
  "lban remove": "> 移除封禁。出来吧，让我看看你有没有长进。"
  "ban-ip": "> 封禁 IP 地址。连洞穴一起封死。"
  "lban mute": "> 禁言玩家。闭嘴，你的声音很吵。"
  "lban unmute": "> 解除禁言。说吧，我听着。"
  "lban warn": "> 警告玩家（4 次→14 日，5 次→永封，我给你留了两次机会）"
  "kick": "> 踢出违规玩家。滚出我的视野。"
  "lban vanish": "> 隐身。我不在这些人的视野里。"
  "lban freeze": "> 冻结。让他停住。"
  "lban unfreeze": "> 解冻。放他走。"
  "lban freeze list": "> 查看冻结名单。"
  "lban check": "> 检查封禁状态。让我看看你是什么货色。"
  "lban history": "> 查看处罚记录。劣迹斑斑，一目了然。"
  "report": "> 举报违规者？说，我替你了结。"
  "lban audit": "> 查看审计日志。所有动作都逃不过我的眼睛。"
  "lban alts": "> 查询同IP小号。躲得再深也会被挖出来。"
  "lban audit export": "> 导出审计日志。留个凭证。"
  "lban audit verify": "> 校验审计完整性。谁敢动手脚，我砍了他的手。"
  "lban sync": "> 查看跨服同步状态。深渊之中，消息一样传得快。"
  "lban rollback": "> 回滚操作。抹掉这段痕迹。"
  "lban models featured": "> 查看本月精选模型。这个月最能打的是谁？"
  "lban list": "> 查看封禁名单。一群杂鱼。"
  "lban a": "> 广播封禁人数。让所有人闭嘴听好。"
  "lban toggle": "> 开关自动广播。随你。"
  "lban reload": "> 重新加载配置。重来一次。"
  "lban handle": "> 处理举报。由我来裁决。"
  "lban admin": "> 打开管理员举报面板。待宰的杂鱼都在里面。"
  "lban tp": "> 传送至该玩家身边。别跑。"
  "setban": "§2✦ §b/setban <玩家名/IP> <时间/forever> <理由> §7- §3修订封禁期限。刑期由我定。"
  "#version": "§2♡ 当前版本: {version} §7| §b模型: 丝柯克 Skirk"

messages:
  get-kick-message: |-
    §b╔══════════════════════════╗
    §b║   §d丝柯克的驱逐通知  §b║
    §b╠══════════════════════════╣
    §d☠️ 你被丝柯克扔出了服务器

    §7原因: §f{reason}

    §d太弱了。练好了再来。
    §b╚══════════════════════════╝
  on-kick-success: |-
    §b✧ 丝柯克说：§a{player} §e已经出局了。
    §b原因: §f{reason}
    §b下一个。§b(◕‿◕✿)
  toggle-broadcast: "§b丝柯克说：§a自动广播已 {enabled}。"
  reload-config: "§b丝柯克说：§a配置重载完毕。继续。"
  add-ban: "§b丝柯克说：§a{player} 关 {days}。理由：{reason}。安静一点，挺好。"
  remove-ban: "§b丝柯克说：§a{player} 放出来了。希望你在里面想清楚了。"
  add-mute: "§b丝柯克说：§a{player} 闭嘴了。理由：{reason}。难得清净。"
  remove-mute: "§b丝柯克说：§a{player} 可以开口了。别说废话。"
  add-ban-ip: "§b丝柯克说：§aIP {ip} 封 {days}。理由：{reason}。连老巢一起端了。"
  remove-ban-ip: "§b丝柯克说：§aIP {ip} 解封。换个地方待着吧。"
  add-warn: "§b丝柯克说：§a{player}，§6{reason}§a。记你一次。别以为是我不敢动手。"
  remove-warn: "§b丝柯克说：§a{player} 的那笔账，抹了。"
  mute-command-blocked: "§c被禁言了还想指挥？安静待着。"
  warn-offline: "§b丝柯克说：§a{player} 不在这儿。理由：{reason}。账先记着，跑不掉的。"
  pending-warnings-notice: "§b丝柯克说：§e{count} 次未清。你还剩多少余地，自己算。"
  expiry-reminder: "§b丝柯克说：§e{target} 的{type}还剩 {remaining}。时间到了我会亲自放人。"
  escalated-ban: "§b丝柯克说：§e第 {count} 次了。{duration}。你的极限，我早就看清了。"
  alts-result: "§b丝柯克说：§a{player} 背后还藏着 {count} 个。一起收拾了。"
  no-alts: "§b丝柯克说：§a{player} 身后没人。孤零零一个。"
  on-report-ban: "§b丝柯克说：§a有人指认了 {player}。{duration}。我信证据。"
  export-result: "§b丝柯克说：§a{count} 条记录，封存好了。"
  sync-status: "§b丝柯克说：§e同步状态：{detail}。深渊之下，消息从不间断。"
  immunity-denied: "§b丝柯克说：§c{target} 站得比你高。想动他，先爬上去。"
  freeze-notify: "§c你已被管理员暂时冻结，理由：§f{reason}§c。安静点。"
  freeze-title: "§c你已被冻结"
  freeze-subtitle: "§f理由：§e{reason}"
  freeze-reminder: "§c你正处于冻结状态。"
  on-freeze: "§a{player} 冻结。理由：{reason}。"
  on-unfreeze: "§a{player} 解冻。"
  on-vanish: "§a隐身{state}。"
  rollback-preview: "§b丝柯克说：§e找到了——{actor} 在 {time} 留下 {count} 条痕迹。要抹掉吗？"
  rollback-result: "§b丝柯克说：§a抹干净了。匹配 {matched}，执行 {executed}，跳过 {skipped}。"
  rollback-no-records: "§b丝柯克说：§e那个时间段，{actor} 什么都没留下。"
  history-empty: "§b丝柯克说：§a{player} 的档案是空的。还算干净。"
  history-header: "§b丝柯克说：§a翻给你看——"
  history-entry-format: "{entry}"
  history-footer: "§b丝柯克说：§7看清楚了？下次我不会再给机会。"
  verify-result-valid: "§b丝柯克说：§a{count} 条，一条没动。算你老实。"
  verify-result-invalid: "§b丝柯克说：§c{count} 条被动过手脚。自己站出来，还是我来找？"

# ---------- 控制台消息 ----------
# 插件自己在服务端控制台说的话（启动/关闭横幅等）；没写在这里的键沿用 models/_base.yml
console:
  ready: "§bLengbanlist §6准备完毕。[]~(￣▽￣)~* §7v{version} §7| §3模型 {model} §7| §3服务端 {server}"
  loading: "§f原神§2正在加载，等着"
  tip: "§6顺口一句: §e{tip}"
  placeholder-hook: "§aPlaceholderAPI 已接上，%lengbanlist_*% 能用"
  auto-update: "§a自动更新开着，正查版本"
  shutdown: "§k§4收拾东西，走了..."
  farewell: "§f就这样，下次见。"
