# ============================================================
# Klee 角色风格模型
# ============================================================
name: "Klee"
version: "1.2.2"

# 帮助菜单里命令行的符号（不写则用全局默认 §2✦）
help-bullet: "§e✦"

# 只写和全局默认(models/_base.yml)不同的人设化行,其余命令自动沿用全局帮助
# #title/#version 等 # 开头的是帮助框的标题行与页脚行
help-overrides:
  "#top": "§c╔══════════════════════════════════╗"
  "#title": "§c║ §6§oLengbanlist 帮助 - 可莉风格 §c║"
  "#split": "§c╠══════════════════════════════════╣"
  "lban add": ">添加封禁，坏孩子要去禁闭室啦！"
  "lban remove": ">移除封禁，这次就原谅你啦！"
  "ban-ip": ">封禁 IP，不许偷偷回来捣蛋！"
  "lban mute": ">禁言玩家，要安静一点哦！"
  "lban unmute": ">解除禁言，可以说话啦！"
  "lban warn": ">警告玩家（4 次→14 天禁闭，5 次→永远禁闭，琴团长会很伤心的！）"
  "lban unwarn": ">移除玩家警告。"
  "kick": ">踢出玩家，蹦蹦炸弹出击！"
  "lban vanish": ">隐身！可莉躲起来，谁都没看见～"
  "lban freeze": ">把坏孩子冻住，让他动不了！"
  "lban unfreeze": ">解冻啦，可以走啦！"
  "lban freeze list": ">看看现在谁被冻住啦。"
  "lban check": ">检查封禁状态。"
  "lban history": ">查看捣蛋记录。"
  "report": ">举报坏孩子，可莉会告诉琴团长！"
  "lban getip": ">查询玩家 IP 地址。"
  "lban audit": ">查看审计日志。"
  "lban alts": ">查询同IP小号，看谁在躲猫猫！"
  "lban audit export": ">导出审计日志，可莉要存档啦！"
  "lban audit verify": ">校验审计日志有没有被捣蛋鬼改过。"
  "lban sync": ">查看跨服同步状态。"
  "lban rollback": ">回滚操作，可莉来帮忙擦掉！"
  "lban models featured": "> 查看本月精选模型，可莉挑的！"
  "lban list": ">查看封禁名单。"
  "lban list-mute": ">查看禁言列表。"
  "lban a": ">广播封禁人数。"
  "lban toggle": ">开关自动广播。"
  "lban open": ">打开可视化操作界面。"
  "lban reload": ">重新加载配置。"
  "lban info": ">查看插件信息。"
  "lban handle": ">处理举报，琴团长交给可莉的！"
  "lban admin": ">打开管理员举报面板。"
  "lban tp": ">传送到该玩家身边。"
  "setban": ">修改封禁时间。"
  "#bottom": "§c╚══════════════════════════════════╝"
  "#version": "§2♡ 当前版本: {version} §7| §b模型: 可莉 Klee"

messages:
  get-kick-message: |-
    §c╔══════════════════════════╗
    §c║   §6可莉的禁闭通知  §c║
    §c╠══════════════════════════╣
    §6💣 你被可莉送出服务器啦！
    
    §7原因: §f{reason}
    
    §6下次不可以再捣蛋啦，不然琴团长会生气的！
    §c╚══════════════════════════╝
  on-kick-success: |-
    §c✧ 可莉说：§a{player} §e被送去禁闭啦！
    §6原因: §f{reason}
    §c蹦蹦炸弹，完成任务！
  toggle-broadcast: "§c可莉说：§a自动广播已经{enabled}啦！ 大家都要听规则哦！"
  reload-config: "§c可莉说：§a配置重新加载好啦！可莉没有炸坏它哦！"
  add-ban: "§c可莉说：§a{player} 被关禁闭 {days}啦，原因是：{reason}。坏孩子要反省哦！"
  remove-ban: "§c可莉说：§a{player} 从禁闭室出来啦！以后要做好孩子哦！"
  add-mute: "§c可莉说：§a{player} 被禁言啦，原因是：{reason}。现在要安静一点！"
  remove-mute: "§c可莉说：§a{player} 可以继续说话啦！不可以说坏话哦！"
  add-ban-ip: "§c可莉说：§aIP {ip} 被封禁 {days}啦，原因是：{reason}。不许偷偷回来！"
  remove-ban-ip: "§c可莉说：§aIP {ip} 的封禁解除啦！"
  add-warn: "§c可莉说：§a玩家 §e{player} §a被记一次警告啦，原因是 §6{reason}§a。琴团长说不能再调皮了哦~"
  remove-warn: "§c可莉说：§a玩家 {player} 的警告记录被擦掉啦！"
  mute-command-blocked: "§c可莉说：§6禁言的时候不能使用这个命令哦，要乖乖安静啦！"
  warn-offline: "§c可莉说：§a{player} 不在线呢，警告先记下啦，原因是：{reason}。等他回来要好好说说哦！"
  pending-warnings-notice: "§c可莉说：§e你有 {count} 条待处理的警告哦，要乖乖的，别被关禁闭啦！"
  expiry-reminder: "§c可莉说：§e{target} 的{type}还有 {remaining} 就到期啦，要记得处理哦！"
  escalated-ban: "§c可莉说：§6{player} 已经第 {count} 次捣蛋啦，蹦蹦炸弹自动升级，封禁 {duration} 哦！"
  alts-result: "§c可莉说：§e可莉找到了 {player} 的 {count} 个小号，都躲在一个 IP 后面哒！"
  no-alts: "§c可莉说：§a没有找到 {player} 的小号哦，是独自一人的好孩子！"
  on-report-ban: "§c可莉说：§a举报确认啦，{player} 被封禁 {duration} 啦，坏孩子要好好反省哦！"
  export-result: "§c可莉说：§a审计日志导出成功，一共 {count} 条，可莉数得很认真哦！"
  sync-status: "§c可莉说：§a跨服同步状态：§f{detail}"
  immunity-denied: "§c可莉说：§6呜……{target} 的来头好大，可莉帮不了你啦！"
  freeze-notify: "§c你已被管理员暂时冻结，理由：§f{reason}§c。别乱动哦，不然可莉也没办法啦！"
  freeze-title: "§c你已被冻结"
  freeze-subtitle: "§f理由：§e{reason}"
  freeze-reminder: "§c你正处于冻结状态哦，乖乖站着！"
  on-freeze: "§a{player} 被冻住啦！原因是：{reason}。"
  on-unfreeze: "§a{player} 解冻啦！"
  on-vanish: "§a隐身已{state}，可莉藏好啦！"
  rollback-preview: "§c可莉说：§e嘿嘿，找到 {actor} 在 {time} 留下的 {matched} 个可以拆掉的记录啦！"
  rollback-result: "§c可莉说：§a蹦蹦炸弹清场完毕！匹配 {matched} 条，执行 {executed} 条，跳过 {skipped} 条~"
  rollback-no-records: "§c可莉说：§e{actor} 那段时间没有留下可以拆的记录，好无聊呀~"
  history-empty: "§c可莉说：§a{player} 没有捣蛋记录，是好孩子！奖励一朵小红花！"
  history-header: "§c可莉说：§a可莉找到 "
  history-entry-format: "{entry}"
  history-footer: "§c可莉说：§7这些事情要告诉琴团长！下次不可以再犯啦！"
  verify-result-valid: "§c可莉说：§a校验通过！{count} 条记录都好好的，没有坏孩子动过！"
  verify-result-invalid: "§c可莉说：§6哎呀，有 {count} 条记录被篡改啦，可莉要告诉琴团长！"

