# ============================================================
# KukiShinobu 角色风格模型
# ============================================================
name: "KukiShinobu"
version: "1.2.0"

# 只写和全局默认(models/_base.yml)不同的人设化行,其余命令自动沿用全局帮助
# #title/#version 等 # 开头的是帮助框的标题行与页脚行
help-overrides:
  "#title": "§b║ §2§oLengbanlist 帮助 - 久岐忍风格 §b║"
  "lban add": "> 添加封禁。单据我开了，别拖。"
  "lban remove": "> 移除封禁。手续办完了，走人。"
  "ban-ip": "> 封禁 IP 地址。连坐处理，一次到位。"
  "lban mute": "> 禁言玩家。终于能消停一会儿。"
  "lban unmute": "> 解除禁言。说正事，别废话。"
  "lban warn": "> 警告玩家（4 次→14 日，5 次→永封，流程写得很清楚）"
  "kick": "> 踢出违规玩家。省得我动手。"
  "lban vanish": "> 隐身。按流程走，不被人发现。"
  "lban freeze": "> 冻结玩家，封住他的行动。"
  "lban unfreeze": "> 解除冻结。流程走完。"
  "lban freeze list": "> 查看当前冻结名单。"
  "lban check": "> 检查封禁状态。让我查一下档案。"
  "lban history": "> 查看处罚记录。前科都在这里，自己看。"
  "report": "> 发现违规者？报上来，走流程。"
  "lban audit": "> 查看审计日志。经手人签字，一个都跑不掉。"
  "lban alts": "> 查询同IP小号。想用小号躲？登记表在这儿。"
  "lban audit export": "> 导出审计日志。归档留存。"
  "lban audit verify": "> 校验审计完整性。对不上账，我可不会装看不见。"
  "lban sync": "> 查看跨服同步状态。跨服的事也要有人管。"
  "lban rollback": "> 回滚操作。这笔撤销，重新走流程。"
  "lban models featured": "> 查看本月精选模型。数据说话，不掺感情。"
  "lban list": "> 查看封禁名单。一份长长的待办清单。"
  "lban a": "> 广播封禁人数。公开通报，清楚明白。"
  "lban toggle": "> 开关自动广播。开关在这儿，自己按。"
  "lban reload": "> 重新加载配置。重来一遍，别出错。"
  "lban handle": "> 处理举报。我来裁定，按规矩办。"
  "lban admin": "> 打开管理员举报面板。待处理的一堆，别积压。"
  "lban tp": "> 传送至该玩家身边。我过去看看情况。"
  "setban": "§2✦ §b/setban <玩家名/IP> <时间/forever> <理由> §7- §3修订封禁期限。条款变更，记好。"
  "#version": "§2♡ 当前版本: {version} §7| §b模型: 久岐忍 KukiShinobu"

messages:
  get-kick-message: |-
    §b╔══════════════════════════╗
    §b║   §d久岐忍的驱逐通知  §b║
    §b╠══════════════════════════╣
    §d☠️ 你被久岐忍请出了服务器

    §7原因: §f{reason}

    §d流程走完了。下次别再麻烦我。
    §b╚══════════════════════════╝
  on-kick-success: |-
    §b✧ 久岐忍说：§a{player} §e已经清出去了。
    §b原因: §f{reason}
    §b总算安静了。§b(◕‿◕✿)
  toggle-broadcast: "§b久岐忍说：§a自动广播已 {enabled}。行了，就这样。"
  reload-config: "§b久岐忍说：§a配置重载完成。这次没出岔子。"
  add-ban: "§b久岐忍说：§a{player} 封禁 {days}。理由：{reason}。单据开好了，照办。"
  remove-ban: "§b久岐忍说：§a{player} 解封。手续齐全，可以走了。"
  add-mute: "§b久岐忍说：§a{player} 禁言。理由：{reason}。耳朵终于清静了。"
  remove-mute: "§b久岐忍说：§a{player} 禁言解除。说正事就行。"
  add-ban-ip: "§b久岐忍说：§aIP {ip} 封禁 {days}。理由：{reason}。一次处理干净，省得反复。"
  remove-ban-ip: "§b久岐忍说：§aIP {ip} 解封。记录已更新。"
  add-warn: "§b久岐忍说：§a{player}，因 §6{reason} §a记一次警告。流程写在那儿，别装作没看见。"
  remove-warn: "§b久岐忍说：§a{player} 的警告撤销了。这次算了。"
  mute-command-blocked: "§c禁言期间指令不可用。这是常识。"
  warn-offline: "§b久岐忍说：§a{player} 不在。理由：{reason}。记录照记，等他上线再说。"
  pending-warnings-notice: "§b久岐忍说：§e你还有 {count} 条警告没清。别等它变成封禁才着急。"
  expiry-reminder: "§b久岐忍说：§e{target} 的{type}还剩 {remaining}。到点自动解除，不用催。"
  escalated-ban: "§b久岐忍说：§e第 {count} 次了。按既定流程，封禁自动升级为 {duration}。流程是早就写好的。"
  alts-result: "§b久岐忍说：§a查完了。{player} 名下 {count} 个同 IP 账号。小号这招一点都不新鲜。"
  no-alts: "§b久岐忍说：§a{player} 名下没有同 IP 账号。这次倒是老实。"
  on-report-ban: "§b久岐忍说：§a举报核实，{player} 封禁 {duration}。流程走完，结案。"
  export-result: "§b久岐忍说：§a{count} 条审计记录已导出。归档完毕。"
  sync-status: "§b久岐忍说：§e跨服同步状态：{detail}。总得有人盯着这些。"
  immunity-denied: "§b久岐忍说：§c{target} 权限高于你。这个流程走不通，别白费力气。"
  freeze-notify: "§c你已被管理员暂时冻结，理由：§f{reason}§c。配合一下，别乱动。"
  freeze-title: "§c你已被冻结"
  freeze-subtitle: "§f理由：§e{reason}"
  freeze-reminder: "§c你正处于冻结状态。请配合。"
  on-freeze: "§a{player} 已冻结。理由：{reason}。单据开好了。"
  on-unfreeze: "§a{player} 已解冻。"
  on-vanish: "§a隐身已{state}。"
  rollback-preview: "§b久岐忍说：§e查到 {actor} 在 {time} 留有 {count} 条可撤销记录。要撤吗？"
  rollback-result: "§b久岐忍说：§a撤销完成。匹配 {matched} 条，执行 {executed} 条，跳过 {skipped} 条。"
  rollback-no-records: "§b久岐忍说：§e那段时间 {actor} 没有可撤销的记录。白查一遍。"
  history-empty: "§b久岐忍说：§a{player} 的档案是空的。老实说，这挺难得的。"
  history-header: "§b久岐忍说：§a记录如下——"
  history-entry-format: "{entry}"
  history-footer: "§b久岐忍说：§7看完了。希望不用再写第二页。"
  verify-result-valid: "§b久岐忍说：§a校验通过，{count} 条记录完整。账目对得上。"
  verify-result-invalid: "§b久岐忍说：§c对不上账。{count} 条记录被改过，必须查到底。"
