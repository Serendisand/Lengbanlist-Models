# ============================================================
# Aino 角色风格模型
# ============================================================
name: "Aino"
version: "1.1.0"

# 只写和全局默认(models/_base.yml)不同的人设化行,其余命令自动沿用全局帮助
# #title/#version 等 # 开头的是帮助框的标题行与页脚行
help-overrides:
  "#title": "§b║ §2§oLengbanlist 帮助 - 爱诺风格 §b║"
  "lban add": "> 添加封禁，这台装置我调试好了，启动！"
  "lban remove": "> 移除封禁，拆掉装置，放他出来！"
  "ban-ip": "> 封禁 IP 地址，整条线路都在我的掌握之中！"
  "lban mute": "> 禁言玩家，给他装个静音模块试试！"
  "lban unmute": "> 解除禁言，模块拆了，说吧说吧！"
  "lban warn": "> 警告玩家（4 次→14 日，5 次→永封，警告也是数据哦）"
  "kick": "> 踢出捣乱的玩家，出门右转！"
  "lban vanish": "> 隐身/现身，把存在感模块调到零，谁都看不见你。"
  "lban freeze": "> 冻结玩家，把他卡在原地，动不了。"
  "lban unfreeze": "> 解除冻结，装置解锁，活动自如。"
  "lban freeze list": "> 查看当前冻结名单。"
  "lban check": "> 检查封禁状态，让我查查数据！"
  "lban history": "> 翻出记录本，看看有没有旧账～"
  "report": "> 发现捣乱的家伙？快说，我这就去查！"
  "lban audit": "> 查看审计日志，所有的操作都有留痕，这才是好设计！"
  "lban alts": "> 查询同IP小号，账号藏在哪我都会找出来！"
  "lban audit export": "> 导出审计日志，打包带走！"
  "lban audit verify": "> 校验审计完整性，哈希链我算过了，没人能改！"
  "lban sync": "> 查看跨服同步状态，机器之间也会聊天哦～"
  "lban rollback": "> 回滚操作，把错误的代码回退掉！"
  "lban models featured": "> 查看本月精选模型，这个月大家都在用哪个呀？"
  "lban list": "> 查看封禁名单，都在这儿了！"
  "lban a": "> 广播封禁人数，让大家都知道现在什么情况！"
  "lban toggle": "> 开关自动广播，按一下就切换～"
  "lban reload": "> 重新加载配置，重启一下就好啦！"
  "lban handle": "> 处理举报，交给我来研判！"
  "lban admin": "> 打开管理员举报面板，一堆待办等着处理呢！"
  "lban tp": "> 传送至该玩家身边，我这就过来！"
  "setban": "§2✦ §b/setban <玩家名/IP> <时间/forever> <理由> §7- §3修订封禁期限，参数我再调一遍。"
  "#version": "§2♡ 当前版本: {version} §7| §b模型: 爱诺 Aino"

messages:
  get-kick-message: |-
    §b╔══════════════════════════╗
    §b║   §d爱诺的驱逐通知  §b║
    §b╠══════════════════════════╣
    §d☠️ 你被爱诺踢出服务器啦！

    §7原因: §f{reason}

    §d回去好好想想，想通了再来~
    §b╚══════════════════════════╝
  on-kick-success: |-
    §b✧ 爱诺说：§a{player} §e已经被我踢出去啦！
    §b原因: §f{reason}
    §b规则要好好看哦~§b(◕‿◕✿)
  toggle-broadcast: "§b爱诺说：§a自动广播已经 {enabled}。这个开关我做得可顺手了！"
  reload-config: "§b爱诺说：§a配置重新加载完成！新版本跑起来就是爽～"
  add-ban: "§b爱诺说：§a{player} 被封禁 {days}，原因是：{reason}。别怪我，这台机器我调了很久的。"
  remove-ban: "§b爱诺说：§a{player} 的封禁解除了！拆装置我最拿手了。"
  add-mute: "§b爱诺说：§a{player} 被禁言了，原因是：{reason}。静音模块，效果拔群！"
  remove-mute: "§b爱诺说：§a{player} 的禁言解除啦，可以说话了～"
  add-ban-ip: "§b爱诺说：§aIP {ip} 被封禁 {days}，原因是：{reason}。这条线路整条都归我管了！"
  remove-ban-ip: "§b爱诺说：§aIP {ip} 的封禁解除！线路通了。"
  add-warn: "§b爱诺说：§a玩家 §e{player} §a因 §6{reason} §a收到一次警告。警告也是数据，会一直记着的哦。"
  remove-warn: "§b爱诺说：§a{player} 的警告记录被我删掉了，就当没发生过！"
  mute-command-blocked: "§b爱诺说：§c禁言期间不能说话哦。要不……先吃点东西？"
  warn-offline: "§b爱诺说：§a{player} 不在，但他的记录在，原因是：{reason}。等他一上线就通知他！"
  pending-warnings-notice: "§b爱诺说：§e你还有 {count} 条警告没处理哦。赶紧的，处理完就轻松了～"
  expiry-reminder: "§b爱诺说：§e提醒一下！{target} 的{type}只剩 {remaining} 了，到时候会自动解除的。"
  escalated-ban: "§b爱诺说：§e{player} 已经是第 {count} 次了，按规则自动升级封禁 {duration}。规则是规则，我照做哦。"
  alts-result: "§b爱诺说：§a查到了！{player} 名下共有 {count} 个同 IP 账号。数据不会骗人的～"
  no-alts: "§b爱诺说：§a{player} 名下干干净净，一个同 IP 账号都没有。这数据我很满意！"
  on-report-ban: "§b爱诺说：§a举报核实完毕，{player} 封禁 {duration}。谢谢你提供的信息，很有用！"
  export-result: "§b爱诺说：§a审计日志导出完成，一共 {count} 条，打包好啦！"
  sync-status: "§b爱诺说：§e跨服同步状态：{detail}。机器之间也讲究配合的嘛～"
  immunity-denied: "§b爱诺说：§c{target} 的权限比你高，这个我操作不了。换个办法吧？"
  freeze-notify: "§c你已被管理员暂时冻结，理由：§f{reason}§c。别急，等解锁就好。"
  freeze-title: "§c你已被冻结"
  freeze-subtitle: "§f理由：§e{reason}"
  freeze-reminder: "§c你正处于冻结状态，锁定装置还没解开呢。"
  on-freeze: "§a{player} 已被冻结，原因是：{reason}。装置已启动。"
  on-unfreeze: "§a{player} 的冻结已解除，装置复位完成。"
  on-vanish: "§a隐身装置已{state}。"
  rollback-preview: "§b爱诺说：§e查到啦——{actor} 在 {time} 留下了 {count} 条可回滚的记录。要动手吗？"
  rollback-result: "§b爱诺说：§a回滚完成！匹配 {matched} 条，执行 {executed} 条，跳过 {skipped} 条。"
  rollback-no-records: "§b爱诺说：§e{actor} 在那段时间没有可回滚的记录，白跑一趟～"
  history-empty: "§b爱诺说：§a{player} 的记录本是空白的，一次都没违纪。不错的记录！"
  history-header: "§b爱诺说：§a我来翻翻 "
  history-entry-format: "{entry}"
  history-footer: "§b爱诺说：§7记录看完了。接下来继续保持，别再添新条目啦～"
  verify-result-valid: "§b爱诺说：§a哈希链校验通过，{count} 条记录完好无损。这才是好工程！"
  verify-result-invalid: "§b爱诺说：§c校验失败了！{count} 条记录里有人动过手脚，必须马上查清楚！"
