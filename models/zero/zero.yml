# ============================================================
# Zero 角色风格模型
# ============================================================
name: "Zero"
version: "1.2.0"

# 只写和全局默认(models/_base.yml)不同的人设化行,其余命令自动沿用全局帮助
# #title/#version 等 # 开头的是帮助框的标题行与页脚行
help-overrides:
  "#title": "§b║ §2§oLengbanlist 帮助 - 零风格 §b║"
  "lban add": "> 添加封禁，零的秩序不容破坏！"
  "lban remove": "> 移除封禁，给予机会。"
  "ban-ip": "> 封禁 IP 地址，维护秩序。"
  "lban mute": "> 禁言玩家，维护秩序。"
  "lban unmute": "> 解除禁言，给予机会。"
  "lban warn": "> 警告玩家（4 次→14 天，5 次→永久秩序封禁）"
  "kick": "> 踢出不守规矩的玩家！"
  "lban vanish": "> 隐身模式启动，从其他玩家的视野中移除。"
  "lban freeze": "> 冻结目标，中止其行动。"
  "lban unfreeze": "> 解除冻结，恢复行动权限。"
  "lban freeze list": "> 列出当前冻结目标。"
  "lban check": "> 检查封禁状态，维护秩序。"
  "lban history": "> 查询秩序档案，一切记录在案。"
  "report": "> 维护秩序，举报违规者。"
  "lban getip": "> 查询玩家 IP 地址，找出违规者。"
  "lban audit": "> 查看审计日志，维护秩序。"
  "lban alts": "> 查询同IP小号，彻查违规者。"
  "lban audit export": "> 导出审计日志，一切记录在案。"
  "lban audit verify": "> 校验审计完整性，确保秩序不被篡改。"
  "lban sync": "> 查看跨服同步状态，掌控一切。"
  "lban rollback": "> 回滚操作，修复权限秩序。"
  "lban list": "> 查看封禁名单，零的秩序不容破坏！"
  "lban a": "> 广播封禁人数，让违规者无所遁形！"
  "lban toggle": "> 开关自动广播，掌控一切！"
  "lban reload": "> 重新加载配置，确保一切正常运行。"
  "lban handle": "> 处理举报，秩序归档。"
  "lban admin": "> 打开管理员举报面板。"
  "lban tp": "> 传送至其身边。"
  "setban": "§2✦ §b/setban <玩家名/IP> <时间/forever> <理由> §7- §3修订秩序。"
  "#version": "§2♡ 当前版本: {version} §7| §b模型: 零 Zero"

messages:
  get-kick-message: |-
    §b╔══════════════════════════╗
    §b║   §d零的驱逐通知  §b║
    §b╠══════════════════════════╣
    §d☠️ 你被零踢出服务器啦！
    
    §7原因: §f{reason}
    
    §d下次请遵守规则哦~
    §b╚══════════════════════════╝
  on-kick-success: |-
    §b✧ 零说：§a{player} §e已被踢出！
    §b原因: §f{reason}
    §b维护秩序，不容破坏！§b(◕‿◕✿)
  toggle-broadcast: "§b零说：§a自动广播已经 {enabled}！ 秩序需要维护！"
  reload-config: "§b零说：§a配置重新加载完成！一切正常运行。"
  add-ban: "§b零说：§a玩家 {player} 已被封禁 {days}，原因是：{reason}。秩序不容破坏！"
  remove-ban: "§b零说：§a玩家 {player} 已从封禁名单中移除。给予机会，重新开始。"
  add-mute: "§b零说：§a玩家 {player} 已被禁言，原因是：{reason}。秩序不容破坏！"
  remove-mute: "§b零说：§a玩家 {player} 的禁言已解除，可以继续说话了。"
  add-ban-ip: "§b零说：§aIP {ip} 已被封禁 {days}，原因是：{reason}。秩序不容破坏！"
  remove-ban-ip: "§b零说：§aIP {ip} 的封禁已解除，给予机会，重新开始。"
  add-warn: "§b零说：§a玩家 §e{player} §a因 §6{reason} §a被记一次警告！请不要再破坏秩序。"
  remove-warn: "§b零说：§a玩家 {player} 的警告记录已移除。"
  mute-command-blocked: "§b零说：§c禁言期间不得使用该命令。静思己过，遵守秩序。"
  warn-offline: "§b零说：§a离线玩家 {player} 已被警告，原因是：{reason}。上线后将收到通知，一切记录在案。"
  pending-warnings-notice: "§b零说：§e你有 {count} 条待处理警告。正视问题，方能维护秩序。"
  expiry-reminder: "§b零说：§a{target} 的{type}将在 {remaining} 后解除，秩序回归。"
  escalated-ban: "§b零说：§a玩家 {player} 第 {count} 次违规，处罚已自动升级为封禁 {duration}。秩序不容破坏！"
  alts-result: "§b零说：§a玩家 {player} 名下查到 {count} 个小号，一切记录在案。"
  no-alts: "§b零说：§a玩家 {player} 名下无任何小号，档案干净。"
  on-report-ban: "§b零说：§a举报已确认，玩家 {player} 已被封禁 {duration}。秩序不容破坏！"
  export-result: "§b零说：§a审计日志已导出，共 {count} 条记录，一切记录在案。"
  sync-status: "§b零说：§a跨服同步状态：§f{detail}"
  immunity-denied: "§b零说：§c目标 {target} 权限等级不低，权限秩序不可逾越！"
  freeze-notify: "§c你已被管理员暂时冻结，理由：§f{reason}§c。请保持静止，等待解除。"
  freeze-title: "§c你已被冻结"
  freeze-subtitle: "§f理由：§e{reason}"
  freeze-reminder: "§c你正处于冻结状态，操作已被拒绝。"
  on-freeze: "§a目标 {player} 已冻结。理由：{reason}。"
  on-unfreeze: "§a目标 {player} 已解冻。"
  on-vanish: "§a隐身模式已{state}。"
  rollback-preview: "§b零说：§e权限审查通过——操作人 {actor} 在 {time} 有 {matched} 条操作待回滚。"
  rollback-result: "§b零说：§a权限秩序已修复。回滚匹配 {matched} 条，执行 {executed} 条，跳过 {skipped} 条。"
  rollback-no-records: "§b零说：§e{actor} 在该时段无违规操作记录。"
  history-empty: "§b零说：§a秩序档案查询完毕，{player} 无任何违规记录。维护秩序，人人有责。"
  history-header: "{entry}"
  history-entry-format: "{entry}"
  history-footer: "§b零说：§7秩序不容破坏，以上记录将永久存档。"
  verify-result-valid: "§b零说：§a审计校验通过，{count} 条记录完整无损。"
  verify-result-invalid: "§b零说：§c审计校验失败！检测到 {count} 条记录被篡改，必须彻查！"
