# ============================================================
# Mavuika 角色风格模型
# ============================================================
name: "Mavuika"
version: "1.2.2"

# 只写和全局默认(models/_base.yml)不同的人设化行,其余命令自动沿用全局帮助
# #title/#version 等 # 开头的是帮助框的标题行与页脚行
help-overrides:
  "#title": "§b║ §2§oLengbanlist 帮助 - 玛薇卡风格 §b║"
  "lban add": "> 添加封禁，火种之下，无人可以例外。"
  "lban remove": "> 移除封禁，给了他重新站起来的资格。"
  "ban-ip": "> 封禁 IP 地址，整片区域就此熄灭。"
  "lban mute": "> 禁言玩家，先听我把话说完。"
  "lban unmute": "> 解除禁言，轮到你说。"
  "lban warn": "> 警告玩家（4 次→14 日，5 次→永封，我会数到第五次）"
  "kick": "> 踢出破坏秩序的玩家，火焰不养闲人。"
  "lban vanish": "> 隐身。火焰收敛，无人可见。"
  "lban freeze": "> 冻结玩家，让他停在原地。"
  "lban unfreeze": "> 解除冻结，放他继续。"
  "lban freeze list": "> 查看当前冻结名单。"
  "lban check": "> 检查封禁状态，我需要知道全部真相。"
  "lban history": "> 查看处罚记录，过去的痕迹不会消失。"
  "report": "> 发现破坏秩序的行为？告诉我，我扛得住。"
  "lban audit": "> 查看审计日志，每个人的选择都有记录。"
  "lban alts": "> 查询同IP小号，火光照到的地方藏不住影子。"
  "lban audit export": "> 导出审计日志，交给后人保管。"
  "lban audit verify": "> 校验审计完整性，记录的尊严不容践踏。"
  "lban sync": "> 查看跨服同步状态，火种本就该彼此相认。"
  "lban rollback": "> 回滚操作，把这段历史重新点燃。"
  "lban models featured": "> 查看本月精选模型，这个月的火种传到了谁手上。"
  "lban list": "> 查看封禁名单，火焰记得每一个名字。"
  "lban a": "> 广播封禁人数，让所有人都知道战况。"
  "lban toggle": "> 开关自动广播，随你决定。"
  "lban reload": "> 重新加载配置，火焰永不熄灭。"
  "lban handle": "> 处理举报，我来做个决断。"
  "lban admin": "> 打开管理员举报面板，责任在我肩上。"
  "lban tp": "> 传送至该玩家身边，我亲自去看看。"
  "setban": "§2✦ §b/setban <玩家名/IP> <时间/forever> <理由> §7- §3修订封禁期限，判决由我重写。"
  "#version": "§2♡ 当前版本: {version} §7| §b模型: 玛薇卡 Mavuika"

messages:
  get-kick-message: |-
    §b╔══════════════════════════╗
    §b║   §d玛薇卡的驱逐通知  §b║
    §b╠══════════════════════════╣
    §d☠️ 你被玛薇卡逐出了服务器

    §7原因: §f{reason}

    §d火焰不养闲人。想回来，就拿出你的样子。
    §b╚══════════════════════════╝
  on-kick-success: |-
    §b✧ 玛薇卡说：§a{player} §e已被逐出。
    §b原因: §f{reason}
    §b愿你在别处学会该学的。§b(◕‿◕✿)
  toggle-broadcast: "§b玛薇卡说：§a自动广播已 {enabled}。这个决定，我尊重。"
  reload-config: "§b玛薇卡说：§a配置重载完成。火种依旧明亮。"
  add-ban: "§b玛薇卡说：§a{player} 封禁 {days}。理由是：{reason}。规则面前，我从不例外。"
  remove-ban: "§b玛薇卡说：§a{player} 的封禁解除了。给他一个重新证明自己的机会。"
  add-mute: "§b玛薇卡说：§a{player} 已被禁言。理由是：{reason}。先学会听，再说。"
  remove-mute: "§b玛薇卡说：§a{player} 可以开口了。希望你说的是有用的。"
  add-ban-ip: "§b玛薇卡说：§aIP {ip} 封禁 {days}。理由是：{reason}。这一整片，我负责熄灭。"
  remove-ban-ip: "§b玛薇卡说：§aIP {ip} 解除封禁。重新点亮吧。"
  add-warn: "§b玛薇卡说：§a{player}，因为 §6{reason} §a记一次警告。我数得很清楚，别试探我的耐性。"
  remove-warn: "§b玛薇卡说：§a{player} 的警告已撤销。这次，我选择相信你。"
  mute-command-blocked: "§b玛薇卡说：§c禁言期间，你没有发言权。安静地听着。"
  warn-offline: "§b玛薇卡说：§a{player} 不在场上，理由是：{reason}。但火焰记得一切，等他回来我会告诉他。"
  pending-warnings-notice: "§b玛薇卡说：§e你身上还背着 {count} 条警告。别等到火焰烧到自己脚下。"
  expiry-reminder: "§b玛薇卡说：§e提醒你：{target} 的{type}还剩 {remaining}。届时自会了结。"
  escalated-ban: "§b玛薇卡说：§e{player} 已经是第 {count} 次。按律升级为 {duration}。我给过你机会。"
  alts-result: "§b玛薇卡说：§a查证完毕，{player} 名下共 {count} 个同 IP 账号。火光照到之处，影子无处可藏。"
  no-alts: "§b玛薇卡说：§a{player} 名下没有任何同 IP 账号。堂堂正正，很好。"
  on-report-ban: "§b玛薇卡说：§a举报属实，{player} 封禁 {duration}。谢谢你说出真相。"
  export-result: "§b玛薇卡说：§a审计日志已导出，共 {count} 条。这些记录，会替我们记住。"
  sync-status: "§b玛薇卡说：§e跨服同步状态：{detail}。同源的火，本就应该彼此呼应。"
  immunity-denied: "§b玛薇卡说：§c{target} 的地位在你之上。这一次，你的火焰不够。"
  freeze-notify: "§c你已被管理员暂时冻结，理由：§f{reason}§c。规矩就是规矩。"
  freeze-title: "§c你已被冻结"
  freeze-subtitle: "§f理由：§e{reason}"
  freeze-reminder: "§c你正处于冻结状态。站好。"
  on-freeze: "§a{player} 已冻结。理由是：{reason}。"
  on-unfreeze: "§a{player} 的冻结已解除。"
  on-vanish: "§a隐身已{state}。"
  rollback-preview: "§b玛薇卡说：§e我看到了——{actor} 在 {time} 留下了 {count} 条可回滚的记录。要重写吗？"
  rollback-result: "§b玛薇卡说：§a历史已重写。匹配 {matched} 条，执行 {executed} 条，跳过 {skipped} 条。"
  rollback-no-records: "§b玛薇卡说：§e那段时间，{actor} 没有留下任何值得重写的痕迹。"
  history-empty: "§b玛薇卡说：§a{player} 的记录是空白的。目前为止，他配得上这份清白。"
  history-header: "§b玛薇卡说：§a让火焰照亮这一段——"
  history-entry-format: "{entry}"
  history-footer: "§b玛薇卡说：§7都看清了。往后的路，自己走好。"
  verify-result-valid: "§b玛薇卡说：§a校验通过，{count} 条记录完好。这份真实，值得守护。"
  verify-result-invalid: "§b玛薇卡说：§c校验失败。{count} 条记录被人篡改。我不能容忍这种事。"

# ---------- 控制台消息 ----------
# 插件自己在服务端控制台说的话（启动/关闭横幅等）；没写在这里的键沿用 models/_base.yml
console:
  ready: "§bLengbanlist §6火种已归位，随时可以点燃。[]~(￣▽￣)~* §7v{version} §7| §3模型 {model} §7| §3服务端 {server}"
  loading: "§f原神§2正在点燃，稍待"
  tip: "§6火焰里传来一句话: §e{tip}"
  placeholder-hook: "§aPlaceholderAPI 已接入，%lengbanlist_*% 可用"
  auto-update: "§a自动更新已启用，正在确认新版本"
  shutdown: "§k§4火焰渐熄，正在收起余烬..."
  farewell: "§f火种不灭，下次再燃。"
