# ============================================================
# YaeMiko 角色风格模型
# ============================================================
name: "YaeMiko"
version: "1.2.2"

# 帮助菜单里命令行的符号（不写则用全局默认 §2✦）
help-bullet: "§5✦"

# 只写和全局默认(models/_base.yml)不同的人设化行,其余命令自动沿用全局帮助
# #title/#version 等 # 开头的是帮助框的标题行与页脚行
help-overrides:
  "#top": "§d╔══════════════════════════════════╗"
  "#title": "§d║ §5§oLengbanlist 帮助 - 八重神子风格 §d║"
  "#split": "§d╠══════════════════════════════════╣"
  "lban add": ">添加封禁，哎呀，又有有趣的家伙了呢。"
  "lban remove": ">移除封禁，给他一点改过机会吧。"
  "ban-ip": ">封禁 IP，别以为换个壳就认不出来哦。"
  "lban mute": ">禁言玩家，让耳根清净一会儿。"
  "lban unmute": ">解除禁言，希望他说点有趣的。"
  "lban warn": ">警告玩家（4 次→14 天禁声，5 次→永久禁演的大结局哦）"
  "lban unwarn": ">移除玩家警告。"
  "kick": ">踢出玩家，小小惩戒而已。"
  "lban vanish": ">隐身～让本宫隐去身影，看场好戏吧。"
  "lban freeze": ">把玩家冻住，让他安分一会儿～"
  "lban unfreeze": ">解冻吧，戏还没演完呢。"
  "lban freeze list": ">看看现在谁动不了～"
  "lban check": ">检查封禁状态。"
  "lban history": ">翻翻旧账，看看有什么好故事。"
  "report": ">举报玩家，把趣事告诉神子吧。"
  "lban getip": ">查询玩家 IP 地址。"
  "lban audit": ">查看审计日志。"
  "lban alts": ">查询同IP小号，看看谁在偷偷换马甲。"
  "lban audit export": ">导出审计日志。"
  "lban audit verify": ">校验审计完整性。"
  "lban sync": ">查看跨服同步状态。"
  "lban rollback": ">回滚操作，有趣的事再演一次～"
  "lban models featured": "> 查看本月精选模型，本月的主角哦～"
  "lban list": ">查看封禁名单。"
  "lban list-mute": ">查看禁言列表。"
  "lban a": ">广播封禁人数。"
  "lban toggle": ">开关自动广播。"
  "lban open": ">打开可视化操作界面。"
  "lban reload": ">重新加载配置。"
  "lban info": ">查看插件信息。"
  "lban handle": ">处理举报，神子亲自落笔结案。"
  "lban admin": ">打开管理员举报面板。"
  "lban tp": ">传送到该玩家身边。"
  "setban": ">修改封禁时间。"
  "#bottom": "§d╚══════════════════════════════════╝"

messages:
  get-kick-message: |-
    §d╔══════════════════════════╗
    §d║   §5八重神子的逐客令  §d║
    §d╠══════════════════════════╣
    §5🦊 哎呀，你被请出服务器了呢。
    
    §7原因: §f{reason}
    
    §5下次可要乖一点，不然故事就更精彩了哦~
    §d╚══════════════════════════╝
  on-kick-success: |-
    §d✧ 八重神子说：§a{player} §e已经被请出去了哦。
    §5原因: §f{reason}
    §d呵呵，这样的展开倒也不坏。
  toggle-broadcast: "§d八重神子说：§a自动广播已经{enabled}啦。 观众们的反应也很重要呢。"
  reload-config: "§d八重神子说：§a配置重新加载完成。嗯，故事又能继续写下去了。"
  add-ban: "§d八重神子说：§a{player} 已被封禁 {days}，原因是：{reason}。真是让人忍不住想写进轻小说呢。"
  remove-ban: "§d八重神子说：§a{player} 已从封禁名单中移除。接下来可别让我失望哦。"
  add-mute: "§d八重神子说：§a{player} 已被禁言，原因是：{reason}。先安静一下，听我讲个故事吧。"
  remove-mute: "§d八重神子说：§a{player} 的禁言已解除。希望接下来的台词能有趣些。"
  add-ban-ip: "§d八重神子说：§aIP {ip} 已被封禁 {days}，原因是：{reason}。小狐狸的眼睛可是很尖的哦。"
  remove-ban-ip: "§d八重神子说：§aIP {ip} 的封禁已解除。"
  add-warn: "§d八重神子说：§a玩家 §e{player} §a因 §6{reason} §a被记一次警告哦。这出戏请好好演，别再让神子失望了~"
  remove-warn: "§d八重神子说：§a玩家 {player} 的警告记录已移除。"
  mute-command-blocked: "§d八重神子说：§c禁言期间不能使用该命令呢。现在还是乖乖当个听众，比较有趣哦。"
  warn-offline: "§d八重神子说：§a{player} 不在线呢，不过警告已经记下了，原因是：{reason}。等他上线，这故事还没讲完哦。"
  pending-warnings-notice: "§d八重神子说：§e你有 {count} 条待处理警告哦。再不好好表现，接下来的剧情可就要变得刺激了呢。"
  expiry-reminder: "§d八重神子说：§e到期提醒：{target} 的{type}还剩 {remaining}。要不要提前放人，就看你这位观众如何安排这场戏了。"
  escalated-ban: "§d八重神子说：§e{player} 第 {count} 次违规，已自动升级封禁 {duration}。呵呵，这位主角的戏份倒是越来越精彩了呢。"
  alts-result: "§d八重神子说：§a查到了哦，{player} 名下共有 {count} 个同IP小号。呵呵，这些小狐狸躲得再深，也逃不过我的眼睛。"
  no-alts: "§d八重神子说：§a{player} 名下没有查出同IP小号呢。是个老实人，倒让神子少了几分捉弄的乐趣。"
  on-report-ban: "§d八重神子说：§a举报已确认，{player} 已被封禁 {duration}。呵呵，这出戏的第一幕，就此开幕了呢。"
  export-result: "§d八重神子说：§a审计日志导出完成，共 {count} 条。这些记录，足够我写上好一段故事了呢。"
  sync-status: "§d八重神子说：§e跨服同步状态：{detail}。数据要整整齐齐，故事才讲得下去哦。"
  immunity-denied: "§d八重神子说：§c哎呀，{target} 可不是你能随意处置的人呢，小心惹祸上身哦～"
  freeze-notify: "§c你已被管理员暂时冻结，理由：§f{reason}§c。哎呀，先别乱动哦～"
  freeze-title: "§c你已被冻结"
  freeze-subtitle: "§f理由：§e{reason}"
  freeze-reminder: "§c你正处于冻结状态呢～真是有趣。"
  on-freeze: "§a{player} 已被冻结，理由是：{reason}。真是个有趣的开场。"
  on-unfreeze: "§a{player} 的冻结已解除，戏继续。"
  on-vanish: "§a隐身已{state}～"
  rollback-preview: "§d八重神子说：§e有趣呢～操作人 {actor} 在 {time} 留下 {matched} 条可回滚的记录。"
  rollback-result: "§d八重神子说：§a一切如我所料～回滚匹配 {matched} 条，执行 {executed} 条，跳过 {skipped} 条。"
  rollback-no-records: "§d八重神子说：§e{actor} 在那段时间没什么可回滚的，真是遗憾呢～"
  history-empty: "§d八重神子说：§a{player} 的故事干干净净，暂时还没有能让我取材的内容呢。"
  history-header: "§d八重神子说：§a让我看看 "
  history-entry-format: "{entry}"
  history-footer: "§d八重神子说：§7呵呵，这些记录若写成小说，倒也挺有看头。"
  verify-result-valid: "§d八重神子说：§a审计哈希链校验完整，共 {count} 条。记录完好无损，省得我费心编排了。"
  verify-result-invalid: "§d八重神子说：§c哎呀，审计日志被人动了手脚呢！校验 {count} 条数据就发现了破绽。呵呵，敢在狐狸眼皮底下做小动作？"

# ---------- 控制台消息 ----------
# 插件自己在服务端控制台说的话（启动/关闭横幅等）；没写在这里的键沿用 models/_base.yml
console:
  ready: "§bLengbanlist §6好戏开场，本宫看着呢。[]~(￣▽￣)~* §7v{version} §7| §3模型 {model} §7| §3服务端 {server}"
  loading: "§f原神§2正在加载，别急，好戏还在后头"
  tip: "§6本宫听来的趣闻: §e{tip}"
  placeholder-hook: "§aPlaceholderAPI 接上了，%lengbanlist_*% 随你用"
  auto-update: "§a自动更新开着，本宫正要看看有什么新鲜事"
  shutdown: "§k§4散场啦，本宫先撤了..."
  farewell: "§f今日到此为止，期待下次的好戏。"
