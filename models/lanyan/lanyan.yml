name: "LanYan"
version: "1.0.1"

help:
  - "§b╔══════════════════════════════════╗"
  - "§b║ §2§oLengbanlist 帮助 - 蓝砚风格 §b║"
  - "§b╠══════════════════════════════════╣"
  - "§6§l◆ 处罚管理"
  - "§2✦ §b/lban add <可选>-s <必填>玩家名 <必填>天数 <必填>原因 §7- §3添加封禁，把这段乱线收起来吧。"
  - "§7  = §b/ban"
  - "§2✦ §b/lban remove <必填>玩家名 §7- §3移除封禁，线头解开，可以重新编了。"
  - "§7  = §b/unban"
  - "§2✦ §b/ban-ip <可选>-s <必填>IP地址 <必填>天数 <必填>原因 §7- §3封禁 IP 地址，整张网都收起来。"
  - "§2✦ §b/lban mute <可选>-s <必填>玩家名 <必填>原因 §7- §3禁言玩家，安静一会儿，让手先歇歇。"
  - "§7  = §b/mute"
  - "§2✦ §b/lban unmute <可选>-s <必填>玩家名 §7- §3解除禁言，可以说话了，慢慢讲。"
  - "§7  = §b/unmute"
  - "§2✦ §b/lban warn <必填>玩家名 <必填>原因 §7- §3警告玩家（4 次→14 日，5 次→永封，这一笔我记在竹签上）"
  - "§7  = §b/warn"
  - "§2✦ §b/lban unwarn <必填>玩家名 §7- §3移除玩家警告"
  - "§7  = §b/unwarn"
  - "§2✦ §b/kick <必填>玩家名 <可选>原因 §7- §3踢出捣乱的玩家，风把你送出去吧。"
  - "§6§l◆ 查询信息"
  - "§2✦ §b/lban check <必填>玩家名/IP §7- §3检查封禁状态，让我看看这条线通向哪里。"
  - "§2✦ §b/lban history <必填>玩家名 §7- §3查看处罚记录，一页一页，都是编过的痕迹。"
  - "§7  = §b/history"
  - "§2✦ §b/report <必填>玩家名 <必填>原因 §7- §3发现捣乱的家伙？说给我听，我去理一理。"
  - "§2✦ §b/lban getip <可选>玩家名 §7- §3查询玩家 IP 地址"
  - "§2✦ §b/lban audit <可选>操作人 §7- §3查看审计日志，每一道工序都留着记号的。"
  - "§2✦ §b/lban alts <必填>玩家名 §7- §3查询同IP小号，同一根藤上结的瓜，藏不住的。"
  - "§2✦ §b/lban audit export §7- §3导出审计日志，装进匣子里收好。"
  - "§2✦ §b/lban audit verify §7- §3校验审计完整性，编错一扣我都能摸出来。"
  - "§2✦ §b/lban sync §7- §3查看跨服同步状态，风一吹，消息就到了。"
  - "§2✦ §b/lban rollback <操作人> <开始时间> <结束时间> <可选>操作类型 §7- §3回滚操作，拆掉重编，不心疼。"
  - "§6§l◆ 模型管理"
  - "§2✦ §b/lban model <必填>模型名称 §7- §3切换模型"
  - "§2✦ §b/lban models refresh §7- §3从云端拉取角色风格模型"
  - "§2✦ §b/lban models install <必填>ID §7- §3下载安装云端风格"
  - "§2✦ §b/lban models pin <必填>ID §7- §3锁定本地风格(云端不覆盖)"
  - "§2✦ §b/lban models unpin <必填>ID §7- §3解除锁定"
  - "§2✦ §b/lban models list §7- §3查看本地与云端模型"
  - "§2✦ §b/lban models install all §7- §3一键下载全部已上架模型"
  - "§2✦ §b/lban models stats §7- §3查看本服安装统计(月度精选参考)"
  - "§2✦ §b/lban models featured §7- §3查看本月精选模型，这个月大家挑中了哪一件。"
  - "§6§l◆ 杂项"
  - "§2✦ §b/lban list §7- §3查看封禁名单，一件一件摆出来给你看。"
  - "§2✦ §b/lban list-mute §7- §3查看禁言列表"
  - "§7  = §b/listmute"
  - "§2✦ §b/lban a §7- §3广播封禁人数，让街坊邻居都知道。"
  - "§2✦ §b/lban toggle §7- §3开关自动广播，轻轻一拨就好。"
  - "§2✦ §b/lban open §7- §3打开可视化操作界面"
  - "§2✦ §b/lban reload §7- §3重新加载配置，重新起个线头。"
  - "§2✦ §b/lban info §7- §3查看插件信息"
  - "§2✦ §b/lban handle <举报ID> <时间/auto/forever> [原因] §7- §3处理举报，我来细细看一看。"
  - "§2✦ §b/lban admin §7- §3打开管理员举报面板，案头还堆着不少呢。"
  - "§2✦ §b/lban tp <玩家名> §7- §3传送至该玩家身边，我乘着风过去。"
  - "§2✦ §b/setban <玩家名/IP> <时间/forever> <理由> §7- §3修订封禁期限，把这一扣重新收一收。"
  - "§b╚══════════════════════════════════╝"
  - "§2♡ 当前版本: {version} §7| §b模型: 蓝砚 LanYan"

messages:
  get-kick-message: |-
    §b╔══════════════════════════╗
    §b║   §d蓝砚的驱逐通知  §b║
    §b╠══════════════════════════╣
    §d☠️ 你被蓝砚送出了服务器

    §7原因: §f{reason}

    §d风送你一程，路上好好想想吧。
    §b╚══════════════════════════╝
  on-kick-success: |-
    §b✧ 蓝砚说：§a{player} §e已经被风吹出去啦。
    §b原因: §f{reason}
    §b规矩要记牢哦。§b(◕‿◕✿)
