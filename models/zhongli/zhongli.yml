# ============================================================
# Zhongli 角色风格模型
# ============================================================
name: "Zhongli"
version: "1.2.2"

# 只写和全局默认(models/_base.yml)不同的人设化行,其余命令自动沿用全局帮助
# #title/#version 等 # 开头的是帮助框的标题行与页脚行
help-overrides:
  "#title": "§b║ §2§oLengbanlist 帮助 - 钟离风格 §b║"
  "lban add": "> 添加封禁，秩序不容破坏。"
  "lban remove": "> 移除封禁，宽恕是美德。"
  "ban-ip": "> 封禁 IP 地址，维护秩序。"
  "lban mute": "> 禁言玩家，维护秩序。"
  "lban unmute": "> 解除禁言，宽恕是美德。"
  "lban warn": "> 警告玩家（LBAC：4 次→14 日，5 次→永封）"
  "kick": "> 踢出破坏秩序的玩家！"
  "lban vanish": "> 隐去身影，行于市井而不为人知。"
  "lban freeze": "> 定住此人，令其暂且驻足。"
  "lban unfreeze": "> 解开束缚，契约既止。"
  "lban freeze list": "> 查看此刻驻足之人。"
  "lban check": "> 检查封禁状态，一切尽在掌控。"
  "lban history": "> 查阅契约档案，凡违契者皆记录在案。"
  "report": "> 发现破坏秩序的行为？及时举报。"
  "lban audit": "> 查看审计日志，一切尽在掌控。"
  "lban alts": "> 查询同IP小号，凡有所属皆可查证。"
  "lban audit export": "> 导出审计日志，录入契约存档。"
  "lban audit verify": "> 校验审计完整性，契约不容篡改。"
  "lban sync": "> 查看跨服同步状态，诸服契约相通。"
  "lban rollback": "> 回滚操作，纠偏契约之误。"
  "lban models featured": "> 查看本月精选模型，诸神之中亦有当令之星。"
  "lban list": "> 查看封禁名单，一切尽在掌控。"
  "lban a": "> 广播封禁人数，维护秩序。"
  "lban toggle": "> 开关自动广播，一切尽在掌控。"
  "lban reload": "> 重新加载配置，确保一切完美无缺。"
  "lban handle": "> 处理举报，依契约之约审结。"
  "lban admin": "> 打开管理员举报面板，总揽契约未尽之事务。"
  "lban tp": "> 传送至该玩家身边，赴约如赴宴。"
  "setban": "§2✦ §b/setban <玩家名/IP> <时间/forever> <理由> §7- §3修订契约封期。"
  "#version": "§2♡ 当前版本: {version} §7| §b模型: 钟离 Zhongli"

messages:
  get-kick-message: |-
    §b╔══════════════════════════╗
    §b║   §d钟离的驱逐通知  §b║
    §b╠══════════════════════════╣
    §d☠️ 你被钟离踢出服务器啦！
    
    §7原因: §f{reason}
    
    §d下次请遵守规则哦~
    §b╚══════════════════════════╝
  on-kick-success: |-
    §b✧ 钟离说：§a{player} §e已被踢出！
    §b原因: §f{reason}
    §b维护秩序，不容破坏！§b(◕‿◕✿)
  toggle-broadcast: "§b钟离说：§a自动广播已经 {enabled}。 秩序需要维护。"
  reload-config: "§b钟离说：§a配置重新加载完成。一切尽在掌控之中。"
  add-ban: "§b钟离说：§a玩家 {player} 已被封禁 {days}，原因是：{reason}。秩序不容破坏。"
  remove-ban: "§b钟离说：§a玩家 {player} 已从封禁名单中移除。宽恕是美德。"
  add-mute: "§b钟离说：§a玩家 {player} 已被禁言，原因是：{reason}。秩序不容破坏。"
  remove-mute: "§b钟离说：§a玩家 {player} 的禁言已解除。宽恕是美德。"
  add-ban-ip: "§b钟离说：§aIP {ip} 已被封禁 {days}，原因是：{reason}。秩序不容破坏。"
  remove-ban-ip: "§b钟离说：§aIP {ip} 的封禁已解除。宽恕是美德。"
  add-warn: "§b钟离说：§a玩家 §e{player} §a因 §6{reason} §a被记一次警告。契约铭刻于心，请不要再逾越了。"
  remove-warn: "§b钟离说：§a玩家 {player} 的警告记录已移除。"
  mute-command-blocked: "§b钟离说：§c禁言期间，不宜动用此令。安分守己，方得长久。"
  warn-offline: "§b钟离说：§a{player} 虽不在场，其过已录于契约之上，原因是：{reason}。待其归来，自当知晓。"
  pending-warnings-notice: "§b钟离说：§e契约有载，你尚有 {count} 条警告待处理。前车之鉴，后事之师，望好自为之。"
  expiry-reminder: "§b钟离说：§e特此提醒：关于 {target} 的{type}，仅余 {remaining}。契约将满，届时可酌情处置。"
  escalated-ban: "§b钟离说：§e{player} 已是第 {count} 次违反规则，依契约之约，自动升级封禁 {duration}。事不过三，此乃天道。"
  alts-result: "§b钟离说：§a经查，{player} 名下共有 {count} 个同源账号。纸终究包不住火，天网恢恢，疏而不漏。"
  no-alts: "§b钟离说：§a{player} 名下并无同源账号，清者自清，坦坦荡荡。"
  on-report-ban: "§b钟离说：§a举报业已确认，{player} 依律封禁 {duration}。法不容情，望诸位引以为戒。"
  export-result: "§b钟离说：§a审计日志导出完毕，共 {count} 条，尽数封存于契约之中，以供查证。"
  sync-status: "§b钟离说：§e跨服同步状态：{detail}。诸服如诸国，契约相通，方能长治久安。"
  immunity-denied: "§b钟离说：§c{target} 之位阶不在你之下，贸然出手有违契约之道。"
  freeze-notify: "§c你已被管理员暂时冻结，理由：§f{reason}§c。且请稍候，勿要妄动。"
  freeze-title: "§c你已被冻结"
  freeze-subtitle: "§f理由：§e{reason}"
  freeze-reminder: "§c你正处于冻结状态，还请静候。"
  on-freeze: "§a{player} 已被冻结，缘由是：{reason}。契约如此。"
  on-unfreeze: "§a{player} 的冻结已解除。"
  on-vanish: "§a隐身已{state}。"
  rollback-preview: "§b钟离说：§e契约之印已显——操作人 {actor} 在 {time} 留有 {matched} 条可回滚之记录。"
  rollback-result: "§b钟离说：§a契约已成。回滚匹配 {matched} 条，执行 {executed} 条，跳过 {skipped} 条。"
  rollback-no-records: "§b钟离说：§e{actor} 在那段时间并无应回滚之契约记录。"
  history-empty: "§b钟离说：§a契约记载中，{player} 未曾违背任何规则。此人值得信任。"
  history-header: "{entry}"
  history-entry-format: "{entry}"
  history-footer: "§b钟离说：§7凡契约者，当以此为鉴。善守规则，方能长久。"
  verify-result-valid: "§b钟离说：§a审计哈希链校验无误，共 {count} 条，一毫不差。契约之重，在于诚信。"
  verify-result-invalid: "§b钟离说：§c审计日志竟遭篡改，共 {count} 条记录已现破绽！契约被毁，此乃大忌，务必彻查。"

# ---------- 控制台消息 ----------
# 插件自己在服务端控制台说的话（启动/关闭横幅等）；没写在这里的键沿用 models/_base.yml
console:
  ready: "§bLengbanlist §6契约已立，可安心托付。[]~(￣▽￣)~* §7v{version} §7| §3模型 {model} §7| §3服务端 {server}"
  loading: "§f原神§2正在加载，稍候片刻"
  tip: "§6有一事相告: §e{tip}"
  placeholder-hook: "§aPlaceholderAPI 已接入，%lengbanlist_*% 可用"
  auto-update: "§a自动更新已启用，正在确认新版本"
  shutdown: "§k§4收拾妥当，先行告退..."
  farewell: "§f契约仍在，后会有期。"
