# ============================================================
# Escoffier 角色风格模型
# ============================================================
name: "Escoffier"
version: "1.0.1"

help:
  - "§b╔══════════════════════════════════╗"
  - "§b║ §2§oLengbanlist 帮助 - 爱可菲风格 §b║"
  - "§b╠══════════════════════════════════╣"
  - "§6§l◆ 处罚管理"
  - "§2✦ §b/lban add <可选>-s <必填>玩家名 <必填>天数 <必填>原因 §7- §3添加封禁。这道菜，退回重做。"
  - "§7  = §b/ban"
  - "§2✦ §b/lban remove <必填>玩家名 §7- §3移除封禁。重新上桌吧，别让我失望。"
  - "§7  = §b/unban"
  - "§2✦ §b/ban-ip <可选>-s <必填>IP地址 <必填>天数 <必填>原因 §7- §3封禁 IP 地址。整间厨房都要停业整顿。"
  - "§2✦ §b/lban mute <可选>-s <必填>玩家名 <必填>原因 §7- §3禁言玩家。厨房里不需要多余的杂音。"
  - "§7  = §b/mute"
  - "§2✦ §b/lban unmute <可选>-s <必填>玩家名 §7- §3解除禁言。可以开口了，说重点。"
  - "§7  = §b/unmute"
  - "§2✦ §b/lban warn <必填>玩家名 <必填>原因 §7- §3警告玩家（4 次→14 日，5 次→永封，配方里没有第三次机会）"
  - "§7  = §b/warn"
  - "§2✦ §b/lban unwarn <必填>玩家名 §7- §3移除玩家警告"
  - "§7  = §b/unwarn"
  - "§2✦ §b/kick <必填>玩家名 <可选>原因 §7- §3踢出不合格的客人。请离开我的厨房。"
  - "§6§l◆ 查询信息"
  - "§2✦ §b/lban check <必填>玩家名/IP §7- §3检查封禁状态。让我看看这份食材新不新鲜。"
  - "§2✦ §b/lban history <必填>玩家名 §7- §3查看处罚记录。这是你的成绩单。"
  - "§7  = §b/history"
  - "§2✦ §b/report <必填>玩家名 <必填>原因 §7- §3发现劣质食材？报上来，我亲自验。"
  - "§2✦ §b/lban getip <可选>玩家名 §7- §3查询玩家 IP 地址"
  - "§2✦ §b/lban audit <可选>操作人 §7- §3查看审计日志。每一道工序都要留档。"
  - "§2✦ §b/lban alts <必填>玩家名 §7- §3查询同IP小号。同一批进货，瞒不过我。"
  - "§2✦ §b/lban audit export §7- §3导出审计日志。装盘，封存。"
  - "§2✦ §b/lban audit verify §7- §3校验审计完整性。分量差一克，我都能尝出来。"
  - "§2✦ §b/lban sync §7- §3查看跨服同步状态。分店之间，配方必须一致。"
  - "§2✦ §b/lban rollback <操作人> <开始时间> <结束时间> <可选>操作类型 §7- §3回滚操作。倒掉重来，别心疼。"
  - "§6§l◆ 模型管理"
  - "§2✦ §b/lban model <必填>模型名称 §7- §3切换模型"
  - "§2✦ §b/lban models refresh §7- §3从云端拉取角色风格模型"
  - "§2✦ §b/lban models install <必填>ID §7- §3下载安装云端风格"
  - "§2✦ §b/lban models pin <必填>ID §7- §3锁定本地风格(云端不覆盖)"
  - "§2✦ §b/lban models unpin <必填>ID §7- §3解除锁定"
  - "§2✦ §b/lban models list §7- §3查看本地与云端模型"
  - "§2✦ §b/lban models install all §7- §3一键下载全部已上架模型"
  - "§2✦ §b/lban models stats §7- §3查看本服安装统计(月度精选参考)"
  - "§2✦ §b/lban models featured §7- §3查看本月精选模型。本月的主打菜。"
  - "§6§l◆ 杂项"
  - "§2✦ §b/lban list §7- §3查看封禁名单。一桌退单的客人。"
  - "§2✦ §b/lban list-mute §7- §3查看禁言列表"
  - "§7  = §b/listmute"
  - "§2✦ §b/lban a §7- §3广播封禁人数。向全场通报。"
  - "§2✦ §b/lban toggle §7- §3开关自动广播。随时可以关。"
  - "§2✦ §b/lban open §7- §3打开可视化操作界面"
  - "§2✦ §b/lban reload §7- §3重新加载配置。配方更新，重新备料。"
  - "§2✦ §b/lban info §7- §3查看插件信息"
  - "§2✦ §b/lban handle <举报ID> <时间/auto/forever> [原因] §7- §3处理举报。我会亲自品鉴这份证据。"
  - "§2✦ §b/lban admin §7- §3打开管理员举报面板。待处理的订单都在这儿。"
  - "§2✦ §b/lban tp <玩家名> §7- §3传送至该玩家身边。我亲自去看看现场。"
  - "§2✦ §b/setban <玩家名/IP> <时间/forever> <理由> §7- §3修订封禁期限。火候由我掌控。"
  - "§b╚══════════════════════════════════╝"
  - "§2♡ 当前版本: {version} §7| §b模型: 爱可菲 Escoffier"

