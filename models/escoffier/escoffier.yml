# ============================================================
# Escoffier 角色风格模型
# ============================================================
name: "Escoffier"
version: "1.2.1"

# 只写和全局默认(models/_base.yml)不同的人设化行,其余命令自动沿用全局帮助
# #title/#version 等 # 开头的是帮助框的标题行与页脚行
help-overrides:
  "#title": "§b║ §2§oLengbanlist 帮助 - 爱可菲风格 §b║"
  "lban add": "> 添加封禁。这道菜，退回重做。"
  "lban remove": "> 移除封禁。重新上桌吧，别让我失望。"
  "ban-ip": "> 封禁 IP 地址。整间厨房都要停业整顿。"
  "lban mute": "> 禁言玩家。厨房里不需要多余的杂音。"
  "lban unmute": "> 解除禁言。可以开口了，说重点。"
  "lban warn": "> 警告玩家（4 次→14 日，5 次→永封，配方里没有第三次机会）"
  "kick": "> 踢出不合格的客人。请离开我的厨房。"
  "lban vanish": "> 隐身，撤下你的存在感。"
  "lban freeze": "> 冻结玩家，让他原地冷却。"
  "lban unfreeze": "> 解除冻结，解冻上桌。"
  "lban freeze list": "> 查看当前冻结名单。"
  "lban check": "> 检查封禁状态。让我看看这份食材新不新鲜。"
  "lban history": "> 查看处罚记录。这是你的成绩单。"
  "report": "> 发现劣质食材？报上来，我亲自验。"
  "lban audit": "> 查看审计日志。每一道工序都要留档。"
  "lban alts": "> 查询同IP小号。同一批进货，瞒不过我。"
  "lban audit export": "> 导出审计日志。装盘，封存。"
  "lban audit verify": "> 校验审计完整性。分量差一克，我都能尝出来。"
  "lban sync": "> 查看跨服同步状态。分店之间，配方必须一致。"
  "lban rollback": "> 回滚操作。倒掉重来，别心疼。"
  "lban models featured": "> 查看本月精选模型。本月的主打菜。"
  "lban list": "> 查看封禁名单。一桌退单的客人。"
  "lban a": "> 广播封禁人数。向全场通报。"
  "lban toggle": "> 开关自动广播。随时可以关。"
  "lban reload": "> 重新加载配置。配方更新，重新备料。"
  "lban handle": "> 处理举报。我会亲自品鉴这份证据。"
  "lban admin": "> 打开管理员举报面板。待处理的订单都在这儿。"
  "lban tp": "> 传送至该玩家身边。我亲自去看看现场。"
  "setban": "§2✦ §b/setban <玩家名/IP> <时间/forever> <理由> §7- §3修订封禁期限。火候由我掌控。"
  "#version": "§2♡ 当前版本: {version} §7| §b模型: 爱可菲 Escoffier"

messages:
  get-kick-message: |-
    §b╔══════════════════════════╗
    §b║   §d爱可菲的驱逐通知  §b║
    §b╠══════════════════════════╣
    §d☠️ 你被爱可菲请出了厨房

    §7原因: §f{reason}

    §d不合格的客人，恕不接待。
    §b╚══════════════════════════╝
  on-kick-success: |-
    §b✧ 爱可菲说：§a{player} §e已被退单。
    §b原因: §f{reason}
    §b厨房需要秩序。§b(◕‿◕✿)
  toggle-broadcast: "§b爱可菲说：§a自动广播已 {enabled}。就这样。"
  reload-config: "§b爱可菲说：§a配置重载完成。重新备料，从头开始。"
  add-ban: "§b爱可菲说：§a{player} 封禁 {days}。理由：{reason}。这道菜不合格，撤下去。"
  remove-ban: "§b爱可菲说：§a{player} 解封了。重新上桌，希望这次能入口。"
  add-mute: "§b爱可菲说：§a{player} 已被禁言。理由：{reason}。厨房需要安静。"
  remove-mute: "§b爱可菲说：§a{player} 的禁言解除了。说吧，简洁一点。"
  add-ban-ip: "§b爱可菲说：§aIP {ip} 封禁 {days}。理由：{reason}。整条供货链都不干净。"
  remove-ban-ip: "§b爱可菲说：§aIP {ip} 解封。换一批货吧。"
  add-warn: "§b爱可菲说：§a{player}，因 §6{reason} §a记一次警告。配方上写得很清楚，没有下一次。"
  remove-warn: "§b爱可菲说：§a{player} 的警告已抹去。这一笔，我不追究了。"
  mute-command-blocked: "§c禁言期间，你无权发言。"
  warn-offline: "§b爱可菲说：§a{player} 不在场。理由：{reason}。记录照记，与人到不到场无关。"
  pending-warnings-notice: "§b爱可菲说：§e你还有 {count} 条警告。清干净之前，别再让我看见你。"
  expiry-reminder: "§b爱可菲说：§e{target} 的{type}还剩 {remaining}。到点了会自动出锅。"
  escalated-ban: "§b爱可菲说：§e第 {count} 次违规。按既定配方，自动升级为 {duration}。"
  alts-result: "§b爱可菲说：§a{player} 名下查出 {count} 个同 IP 账号。同一批货，味道都一样。"
  no-alts: "§b爱可菲说：§a{player} 名下没有同 IP 账号。干净。"
  on-report-ban: "§b爱可菲说：§a举报已核实。{player} 封禁 {duration}。证据很足，我认可。"
  export-result: "§b爱可菲说：§a{count} 条审计记录已导出装盘。"
  sync-status: "§b爱可菲说：§e跨服同步状态：{detail}。各分店配方一致，才叫专业。"
  immunity-denied: "§b爱可菲说：§c{target} 的权限在你之上。这道菜不归你管。"
  freeze-notify: "§c你已被管理员暂时冻结，理由：§f{reason}§c。先冷着吧。"
  freeze-title: "§c你已被冻结"
  freeze-subtitle: "§f理由：§e{reason}"
  freeze-reminder: "§c你正处于冻结状态。别催。"
  on-freeze: "§a{player} 已冻结，理由：{reason}。"
  on-unfreeze: "§a{player} 已解冻。"
  on-vanish: "§a隐身已{state}。"
  rollback-preview: "§b爱可菲说：§e{actor} 在 {time} 留下了 {count} 条可回滚记录。要倒掉重做吗？"
  rollback-result: "§b爱可菲说：§a重做完成。匹配 {matched} 条，执行 {executed} 条，跳过 {skipped} 条。"
  rollback-no-records: "§b爱可菲说：§e那段时间，{actor} 没留下任何东西。"
  history-empty: "§b爱可菲说：§a{player} 的记录是空的。到目前为止，还算合格。"
  history-header: "§b爱可菲说：§a这是你的成绩单——"
  history-entry-format: "{entry}"
  history-footer: "§b爱可菲说：§7都看完了。下次别再让我填新的。"
  verify-result-valid: "§b爱可菲说：§a哈希链校验通过，{count} 条，分毫不差。"
  verify-result-invalid: "§b爱可菲说：§c校验失败。{count} 条记录被人动过。谁碰的，自己站出来。"
