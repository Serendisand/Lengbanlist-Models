  loading: "§f原神§2正在加载，堂主马上就来～"
  tip: "§6堂主偷偷告诉你: §e{tip}"
  placeholder-hook: "§aPlaceholderAPI 接上啦，%lengbanlist_*% 都能用～"
  auto-update: "§a自动更新开着呢，堂主正在看看有没有新版～"
  shutdown: "§k§4打烊啦，堂主正在收拾行李qwq..."
  farewell: "§f往生堂今日打烊，下次再来哦～"
