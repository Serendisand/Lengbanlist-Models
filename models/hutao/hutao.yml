# ============================================================
# HuTao 角色风格模型
# ============================================================
name: "HuTao"
version: "1.2.2"

# 只写和全局默认(models/_base.yml)不同的人设化行,其余命令自动沿用全局帮助
# #title/#version 等 # 开头的是帮助框的标题行与页脚行
help-overrides:
  "#title": "§b║ §2§oLengbanlist 帮助 - 胡桃风格 §b║"
  "lban add": "> 添加封禁，不守规矩就封了！"
  "lban remove": "> 移除封禁，知错能改就放过他们吧！"
  "ban-ip": "> 封禁 IP 地址，别再捣乱了！"
  "lban mute": "> 禁言玩家，让他们安静一会儿！"
  "lban unmute": "> 解除禁言，让他们继续说话吧！"
  "lban warn": "> 警告玩家（4 次→14 天，5 次→永久）"
  "kick": "> 踢出捣乱的玩家！"
  "lban vanish": "> 隐身，堂主悄悄路过，谁都看不见～"
  "lban freeze": "> 冻结玩家，让他先在这站会儿吧！"
  "lban unfreeze": "> 解除冻结，客人可以走啦～"
  "lban freeze list": "> 看看有谁正被冻着。"
  "lban check": "> 检查封禁状态，看看谁在捣乱！"
  "lban history": "> 翻翻案底，让胡桃瞧瞧！"
  "report": "> 发现捣乱的家伙？快举报给胡桃！"
  "lban getip": "> 查询玩家 IP 地址，看看谁在捣乱！"
  "lban audit": "> 查看审计日志，看看谁在捣乱！"
  "lban alts": "> 查询同IP小号，看谁在偷偷搞小动作！"
  "lban audit export": "> 导出审计日志，胡桃的账本备份一份！"
  "lban audit verify": "> 校验审计完整性，看看有没有人动手脚！"
  "lban sync": "> 查看跨服同步状态，大家都同步了没有！"
  "lban rollback": "> 回滚操作，做错的事要擦掉哦~"
  "lban models featured": "> 查看本月精选模型，胡桃给你挑了个最有趣的~"
  "lban list": "> 查看封禁名单，这些家伙真是麻烦！"
  "lban list-mute": "> 查看禁言列表，看看谁被胡桃禁言了！"
  "lban a": "> 广播封禁人数，让大家都知道！"
  "lban toggle": "> 开关自动广播，想听就听不想听就关！"
  "lban open": "> 打开可视化操作界面！"
  "lban reload": "> 重新加载配置，说不定能发现新东西！"
  "lban handle": "> 处理举报哒，客卿说不要再积压啦~"
  "lban admin": "> 打开管理员举报面板，往生堂的订单都汇总到这！"
  "lban tp": "> 传送到该玩家身边，胡桃亲自上门拜访！"
  "setban": "§2✦ §b/setban <玩家名/IP> <时间/forever> <理由> §7- §3修改封禁时间哒"
  "#version": "§2♡ 当前版本: {version} §7| §b模型: 胡桃 HuTao"

messages:
  get-kick-message: |-
    §b╔══════════════════════════╗
    §b║   §d胡桃的驱逐通知  §b║
    §b╠══════════════════════════╣
    §d☠️ 你被胡桃踢出服务器啦！
    
    §7原因: §f{reason}
    
    §d下次请遵守规则哦~
    §b╚══════════════════════════╝
  on-kick-success: |-
    §b✧ 胡桃说：§a{player} §e已被踢出！
    §b原因: §f{reason}
    §b维护往生堂的和平！§b(◕‿◕✿)
  toggle-broadcast: "§b胡桃说：§a自动广播已经 {enabled}！ 想听就听，不想听就关！"
  reload-config: "§b胡桃说：§a配置重新加载完成！说不定能发现新东西！"
  add-ban: "§b胡桃说：§a{player} 已被封禁 {days}，原因是：{reason}！不守规矩，就别怪胡桃无情！"
  remove-ban: "§b胡桃说：§a{player} 已从封禁名单中移除。知错能改，就放过他们吧！"
  add-mute: "§b胡桃说：§a{player} 已被禁言，原因是：{reason}！让他们安静一会儿吧！"
  remove-mute: "§b胡桃说：§a{player} 的禁言已解除，可以继续说话了！"
  add-ban-ip: "§b胡桃说：§aIP {ip} 已被封禁 {days}，原因是：{reason}！别再捣乱了！"
  remove-ban-ip: "§b胡桃说：§aIP {ip} 的封禁已解除，放过他们吧！"
  add-warn: "§b胡桃说：§a玩家 §e{player} §a因 §6{reason} §a被记一次警告！别再给往生堂添生意了哦~"
  remove-warn: "§b胡桃说：§a玩家 {player} 的警告记录已移除。"
  mute-command-blocked: "§b胡桃说：§c你还在禁言中哒！别想用命令，先安静待着吧~"
  warn-offline: "§b胡桃说：§a{player} 不在线哒，不过警告已经记上啦，原因是：{reason}！等他上线再好好说道说道~"
  pending-warnings-notice: "§b胡桃说：§e你有 {count} 条待处理警告哒！乖乖改正，不然往生堂要来找你玩咯~"
  expiry-reminder: "§b胡桃说：§e到期提醒哒！{target} 的{type}还剩 {remaining}，要不要提前放人呢？"
  escalated-ban: "§b胡桃说：§e{player} 这是第 {count} 次违规哒，自动升级封禁 {duration}！三番五次，往生堂可要好好款待了~"
  alts-result: "§b胡桃说：§a查到了！{player} 有 {count} 个小号同住一个IP哒，一个个都逃不过胡桃的眼睛~"
  no-alts: "§b胡桃说：§a{player} 没查出小号哒，是个老实人，往生堂给你点赞~"
  on-report-ban: "§b胡桃说：§a举报确认哒！{player} 已被封禁 {duration}！正义的铁拳从不迟到~"
  export-result: "§b胡桃说：§a审计日志导出完成哒，一共 {count} 条！往生堂的账本记得明明白白~"
  sync-status: "§b胡桃说：§e跨服同步状态：{detail}！各服务器都要乖乖听胡桃的指挥哒~"
  immunity-denied: "§b胡桃说：§c这位客人 {target} 权限不小，客卿我也动不了手呢~"
  freeze-notify: "§c你已被管理员暂时冻结，理由：§f{reason}§c。先别急，堂主忙着呢～"
  freeze-title: "§c你已被冻结"
  freeze-subtitle: "§f理由：§e{reason}"
  freeze-reminder: "§c你正处于冻结状态，乖乖站着哦～"
  on-freeze: "§a{player} 已被冻结，理由是：{reason}。"
  on-unfreeze: "§a{player} 的冻结已解除，慢走不送～"
  on-vanish: "§a隐身已{state}，堂主去做点小生意～"
  rollback-preview: "§b胡桃说：§e操作人 {actor} 在 {time} 共留下 {matched} 条可以回滚的记录，要动手吗？"
  rollback-result: "§b胡桃说：§a回滚好啦！匹配 {matched} 条，办成 {executed} 条，跳过 {skipped} 条~"
  rollback-no-records: "§b胡桃说：§e{actor} 那段时间什么坏事都没干，找不到可回滚的记录哦~"
  history-empty: "§b胡桃说：§a{player} 是个乖孩子，没有任何案底哦！往生堂给他点赞~"
  history-header: "§b胡桃说：§a让胡桃翻翻 "
  history-entry-format: "{entry}"
  history-footer: "§b胡桃说：§7看完了吧？记得遵纪守法哦，不然往生堂随时欢迎~"
  verify-result-valid: "§b胡桃说：§a审计哈希链校验完整哒，一共 {count} 条，一个都没动过~"
  verify-result-invalid: "§b胡桃说：§c糟了糟了！审计日志被动手脚哒！校验 {count} 条就发现了破绽，这可不行！"

