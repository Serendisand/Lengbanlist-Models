    §b╔══════════════════════════╗
    §b║   §d胡桃的驱逐通知  §b║
    §b╠══════════════════════════╣
    §d☠️ 你被胡桃踢出服务器啦！
    
    §7原因: §f{reason}
    
    §d下次请遵守规则哦~
    §b╚══════════════════════════╝
  on-kick-success: |-
    §b✧ 胡桃说：§a{player} §e已被踢出！
    §b原因: §f{reason}
    §b维护往生堂的和平！§b(◕‿◕✿)
