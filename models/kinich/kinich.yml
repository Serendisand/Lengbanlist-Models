name: "Kinich"
version: "1.0.1"

help:
  - "§b╔══════════════════════════════════╗"
  - "§b║ §2§oLengbanlist 帮助 - 基尼奇风格 §b║"
  - "§b╠══════════════════════════════════╣"
  - "§6§l◆ 处罚管理"
  - "§2✦ §b/lban add <可选>-s <必填>玩家名 <必填>天数 <必填>原因 §7- §3添加封禁。这单我接了。"
  - "§7  = §b/ban"
  - "§2✦ §b/lban remove <必填>玩家名 §7- §3移除封禁。委托完成，结账。"
  - "§7  = §b/unban"
  - "§2✦ §b/ban-ip <可选>-s <必填>IP地址 <必填>天数 <必填>原因 §7- §3封禁 IP 地址。整条路线一起截断，省事。"
  - "§2✦ §b/lban mute <可选>-s <必填>玩家名 <必填>原因 §7- §3禁言玩家。安静是免费的。"
  - "§7  = §b/mute"
  - "§2✦ §b/lban unmute <可选>-s <必填>玩家名 §7- §3解除禁言。想说话，可以说了。"
  - "§7  = §b/unmute"
  - "§2✦ §b/lban warn <必填>玩家名 <必填>原因 §7- §3警告玩家（4 次→14 日，5 次→永封，账我算得很清楚）"
  - "§7  = §b/warn"
  - "§2✦ §b/lban unwarn <必填>玩家名 §7- §3移除玩家警告"
  - "§7  = §b/unwarn"
  - "§2✦ §b/kick <必填>玩家名 <可选>原因 §7- §3踢出违规玩家。送货上门，请签收。"
  - "§6§l◆ 查询信息"
  - "§2✦ §b/lban check <必填>玩家名/IP §7- §3检查封禁状态。查一下就知道。"
  - "§2✦ §b/lban history <必填>玩家名 §7- §3查看处罚记录。账本在这儿，自己看。"
  - "§7  = §b/history"
  - "§2✦ §b/report <必填>玩家名 <必填>原因 §7- §3发现违规者？报给我，我出工。"
  - "§2✦ §b/lban getip <可选>玩家名 §7- §3查询玩家 IP 地址"
  - "§2✦ §b/lban audit <可选>操作人 §7- §3查看审计日志。经手的每一笔都有单子。"
  - "§2✦ §b/lban alts <必填>玩家名 §7- §3查询同IP小号。同一批货，跑不掉。"
  - "§2✦ §b/lban audit export §7- §3导出审计日志。存档，走人。"
  - "§2✦ §b/lban audit verify §7- §3校验审计完整性。账目对不对，我一眼就看出来。"
  - "§2✦ §b/lban sync §7- §3查看跨服同步状态。信息跑得比我还快。"
  - "§2✦ §b/lban rollback <操作人> <开始时间> <结束时间> <可选>操作类型 §7- §3回滚操作。这笔作废，重开。"
  - "§6§l◆ 模型管理"
  - "§2✦ §b/lban model <必填>模型名称 §7- §3切换模型"
  - "§2✦ §b/lban models refresh §7- §3从云端拉取角色风格模型"
  - "§2✦ §b/lban models install <必填>ID §7- §3下载安装云端风格"
  - "§2✦ §b/lban models pin <必填>ID §7- §3锁定本地风格(云端不覆盖)"
  - "§2✦ §b/lban models unpin <必填>ID §7- §3解除锁定"
  - "§2✦ §b/lban models list §7- §3查看本地与云端模型"
  - "§2✦ §b/lban models install all §7- §3一键下载全部已上架模型"
  - "§2✦ §b/lban models stats §7- §3查看本服安装统计(月度精选参考)"
  - "§2✦ §b/lban models featured §7- §3查看本月精选模型。这个月的订单量最高者。"
  - "§6§l◆ 杂项"
  - "§2✦ §b/lban list §7- §3查看封禁名单。一长串未结的账。"
  - "§2✦ §b/lban list-mute §7- §3查看禁言列表"
  - "§7  = §b/listmute"
  - "§2✦ §b/lban a §7- §3广播封禁人数。让所有人都知道数量。"
  - "§2✦ §b/lban toggle §7- §3开关自动广播。开还是关，一个指令的事。"
  - "§2✦ §b/lban open §7- §3打开可视化操作界面"
  - "§2✦ §b/lban reload §7- §3重新加载配置。清点完毕。"
  - "§2✦ §b/lban info §7- §3查看插件信息"
  - "§2✦ §b/lban handle <举报ID> <时间/auto/forever> [原因] §7- §3处理举报。我来出这趟工。"
  - "§2✦ §b/lban admin §7- §3打开管理员举报面板。委托都堆在这儿了。"
  - "§2✦ §b/lban tp <玩家名> §7- §3传送至该玩家身边。路上不耽搁。"
  - "§2✦ §b/setban <玩家名/IP> <时间/forever> <理由> §7- §3修订封禁期限。条款重议，价钱不变。"
  - "§b╚══════════════════════════════════╝"
  - "§2♡ 当前版本: {version} §7| §b模型: 基尼奇 Kinich"

messages:
  get-kick-message: |-
    §b╔══════════════════════════╗
    §b║   §d基尼奇的驱逐通知  §b║
    §b╠══════════════════════════╣
    §d☠️ 你被基尼奇送出了服务器

    §7原因: §f{reason}

    §d这单到此为止。请吧。
    §b╚══════════════════════════╝
  on-kick-success: |-
    §b✧ 基尼奇说：§a{player} §e已送出。
    §b原因: §f{reason}
    §b委托完成。§b(◕‿◕✿)
  toggle-broadcast: "§b基尼奇说：§a自动广播已 {enabled}。按规矩来。"
  reload-config: "§b基尼奇说：§a配置重载完成。清点无误。"
  add-ban: "§b基尼奇说：§a{player} 封禁 {days}。理由：{reason}。这单我接了，照章办。"
  remove-ban: "§b基尼奇说：§a{player} 解封。账清了，两不相欠。"
  add-mute: "§b基尼奇说：§a{player} 禁言。理由：{reason}。省事。"
  remove-mute: "§b基尼奇说：§a{player} 禁言解除。可以开口了。"
  add-ban-ip: "§b基尼奇说：§aIP {ip} 封禁 {days}。理由：{reason}。整条路线一并截断，效率高。"
  remove-ban-ip: "§b基尼奇说：§aIP {ip} 解封。路子重新打开了。"
  add-warn: "§b基尼奇说：§a{player}，因 §6{reason} §a记一次警告。账我算得清楚，别想赖。"
  remove-warn: "§b基尼奇说：§a{player} 的警告销了。这笔勾掉。"
  mute-command-blocked: "§b基尼奇说：§c禁言中，这指令你用不了。"
  warn-offline: "§b基尼奇说：§a{player} 不在。理由：{reason}。账先记着，人跑不了。"
  pending-warnings-notice: "§b基尼奇说：§e你还挂着 {count} 条警告。清完再说别的。"
