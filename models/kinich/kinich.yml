# ============================================================
# Kinich 角色风格模型
# ============================================================
name: "Kinich"
version: "1.2.1"

# 只写和全局默认(models/_base.yml)不同的人设化行,其余命令自动沿用全局帮助
# #title/#version 等 # 开头的是帮助框的标题行与页脚行
help-overrides:
  "#title": "§b║ §2§oLengbanlist 帮助 - 基尼奇风格 §b║"
  "lban add": "> 添加封禁。这单我接了。"
  "lban remove": "> 移除封禁。委托完成，结账。"
  "ban-ip": "> 封禁 IP 地址。整条路线一起截断，省事。"
  "lban mute": "> 禁言玩家。安静是免费的。"
  "lban unmute": "> 解除禁言。想说话，可以说了。"
  "lban warn": "> 警告玩家（4 次→14 日，5 次→永封，账我算得很清楚）"
  "kick": "> 踢出违规玩家。送货上门，请签收。"
  "lban vanish": "> 隐身。这单不露面。"
  "lban freeze": "> 冻结玩家，把目标定在原地。"
  "lban unfreeze": "> 解除冻结。这单到此为止。"
  "lban freeze list": "> 查看当前目标名单。"
  "lban check": "> 检查封禁状态。查一下就知道。"
  "lban history": "> 查看处罚记录。账本在这儿，自己看。"
  "report": "> 发现违规者？报给我，我出工。"
  "lban audit": "> 查看审计日志。经手的每一笔都有单子。"
  "lban alts": "> 查询同IP小号。同一批货，跑不掉。"
  "lban audit export": "> 导出审计日志。存档，走人。"
  "lban audit verify": "> 校验审计完整性。账目对不对，我一眼就看出来。"
  "lban sync": "> 查看跨服同步状态。信息跑得比我还快。"
  "lban rollback": "> 回滚操作。这笔作废，重开。"
  "lban models featured": "> 查看本月精选模型。这个月的订单量最高者。"
  "lban list": "> 查看封禁名单。一长串未结的账。"
  "lban a": "> 广播封禁人数。让所有人都知道数量。"
  "lban toggle": "> 开关自动广播。开还是关，一个指令的事。"
  "lban reload": "> 重新加载配置。清点完毕。"
  "lban handle": "> 处理举报。我来出这趟工。"
  "lban admin": "> 打开管理员举报面板。委托都堆在这儿了。"
  "lban tp": "> 传送至该玩家身边。路上不耽搁。"
  "setban": "§2✦ §b/setban <玩家名/IP> <时间/forever> <理由> §7- §3修订封禁期限。条款重议，价钱不变。"
  "#version": "§2♡ 当前版本: {version} §7| §b模型: 基尼奇 Kinich"

messages:
  get-kick-message: |-
    §b╔══════════════════════════╗
    §b║   §d基尼奇的驱逐通知  §b║
    §b╠══════════════════════════╣
    §d☠️ 你被基尼奇送出了服务器

    §7原因: §f{reason}

    §d这单到此为止。请吧。
    §b╚══════════════════════════╝
  on-kick-success: |-
    §b✧ 基尼奇说：§a{player} §e已送出。
    §b原因: §f{reason}
    §b委托完成。§b(◕‿◕✿)
  toggle-broadcast: "§b基尼奇说：§a自动广播已 {enabled}。按规矩来。"
  reload-config: "§b基尼奇说：§a配置重载完成。清点无误。"
  add-ban: "§b基尼奇说：§a{player} 封禁 {days}。理由：{reason}。这单我接了，照章办。"
  remove-ban: "§b基尼奇说：§a{player} 解封。账清了，两不相欠。"
  add-mute: "§b基尼奇说：§a{player} 禁言。理由：{reason}。省事。"
  remove-mute: "§b基尼奇说：§a{player} 禁言解除。可以开口了。"
  add-ban-ip: "§b基尼奇说：§aIP {ip} 封禁 {days}。理由：{reason}。整条路线一并截断，效率高。"
  remove-ban-ip: "§b基尼奇说：§aIP {ip} 解封。路子重新打开了。"
  add-warn: "§b基尼奇说：§a{player}，因 §6{reason} §a记一次警告。账我算得清楚，别想赖。"
  remove-warn: "§b基尼奇说：§a{player} 的警告销了。这笔勾掉。"
  mute-command-blocked: "§b基尼奇说：§c禁言中，这指令你用不了。"
  warn-offline: "§b基尼奇说：§a{player} 不在。理由：{reason}。账先记着，人跑不了。"
  pending-warnings-notice: "§b基尼奇说：§e你还挂着 {count} 条警告。清完再说别的。"
  expiry-reminder: "§b基尼奇说：§e{target} 的{type}还剩 {remaining}。到时间自动结清。"
  escalated-ban: "§b基尼奇说：§e第 {count} 次。按条款自动升级为 {duration}。规矩写在合同里。"
  alts-result: "§b基尼奇说：§a查到了。{player} 名下 {count} 个同 IP 账号。同一批货，一起算。"
  no-alts: "§b基尼奇说：§a{player} 名下没有同 IP 账号。干净。"
  on-report-ban: "§b基尼奇说：§a举报核实。{player} 封禁 {duration}。情报有用，记你一功。"
  export-result: "§b基尼奇说：§a{count} 条审计记录已导出。存档完毕。"
  sync-status: "§b基尼奇说：§e跨服同步状态：{detail}。消息传得比人快。"
  immunity-denied: "§b基尼奇说：§c{target} 权限比你高。这单我不接，接不了。"
  freeze-notify: "§c你已被管理员暂时冻结，理由：§f{reason}§c。别动，这是规矩。"
  freeze-title: "§c你已被冻结"
  freeze-subtitle: "§f理由：§e{reason}"
  freeze-reminder: "§c你正处于冻结状态，别乱动。"
  on-freeze: "§a{player} 已冻结。理由：{reason}。"
  on-unfreeze: "§a{player} 已解冻。"
  on-vanish: "§a隐身已{state}。"
  rollback-preview: "§b基尼奇说：§e查到了——{actor} 在 {time} 留下 {count} 条可作废的记录。动手吗？"
  rollback-result: "§b基尼奇说：§a处理完毕。匹配 {matched} 条，执行 {executed} 条，跳过 {skipped} 条。"
  rollback-no-records: "§b基尼奇说：§e那段时间 {actor} 没留下可作废的记录。白跑一趟。"
  history-empty: "§b基尼奇说：§a{player} 的账本是空的。目前为止，信誉良好。"
  history-header: "§b基尼奇说：§a账本在这儿——"
  history-entry-format: "{entry}"
  history-footer: "§b基尼奇说：§7看完了。希望别再有下一页。"
  verify-result-valid: "§b基尼奇说：§a校验通过，{count} 条账目分毫不差。"
  verify-result-invalid: "§b基尼奇说：§c账对不上。{count} 条记录被人动过，得查清楚是谁。"
