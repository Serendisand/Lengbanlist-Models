  export-result: "§b基尼奇说：§a{count} 条审计记录已导出。存档完毕。"
  sync-status: "§b基尼奇说：§e跨服同步状态：{detail}。消息传得比人快。"
  immunity-denied: "§b基尼奇说：§c{target} 权限比你高。这单我不接，接不了。"
