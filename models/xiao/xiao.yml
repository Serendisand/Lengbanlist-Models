# ============================================================
# Xiao 角色风格模型
# ============================================================
name: "Xiao"
version: "1.2.0"

# 只写和全局默认(models/_base.yml)不同的人设化行,其余命令自动沿用全局帮助
# #title/#version 等 # 开头的是帮助框的标题行与页脚行
help-overrides:
  "#title": "§b║ §2§oLengbanlist 帮助 - 魈风格 §b║"
  "lban add": "> 添加封禁，不守规矩就封了！"
  "lban remove": "> 移除封禁，知错能改就放过他们吧！"
  "ban-ip": "> 封禁 IP 地址，别再捣乱了！"
  "lban mute": "> 禁言玩家，让他们安静一会儿！"
  "lban unmute": "> 解除禁言，让他们继续说话吧！"
  "lban warn": "> 警告玩家（4 次→14 日业障，5 次→永久业障）"
  "kick": "> 踢出捣乱的玩家！"
  "lban vanish": "> 隐去身形，业障不现于人前。"
  "lban freeze": "> 定住他。"
  "lban unfreeze": "> 解开。"
  "lban freeze list": "> 查看冻结之人。"
  "lban check": "> 检查封禁状态，看看谁在捣乱！"
  "lban history": "> 查看业障记录，让我瞧瞧……"
  "report": "> 发现捣乱的家伙？快举报给魈！"
  "lban getip": "> 查询玩家 IP 地址，看看谁在捣乱！"
  "lban audit": "> 查看审计日志，看看谁在捣乱！"
  "lban alts": "> 查询同IP小号，看看他们还有别的身份！"
  "lban audit export": "> 导出审计日志，把证据好好收着！"
  "lban audit verify": "> 校验审计完整性，看看有没有人动手脚！"
  "lban sync": "> 查看跨服同步状态，一切尽在掌握！"
  "lban rollback": "> 回滚操作，清除业障。"
  "lban list": "> 查看封禁名单，这些家伙真是麻烦！"
  "lban a": "> 广播封禁人数，让大家都知道！"
  "lban toggle": "> 开关自动广播，想听就听不想听就关！"
  "lban reload": "> 重新加载配置，说不定能发现新东西！"
  "lban handle": "> 处理举报，清除应尽之业。"
  "lban admin": "> 打开管理员举报面板，夜叉的审视。"
  "lban tp": "> 传送至其身边，护其周全。"
  "setban": "§2✦ §b/setban <玩家名/IP> <时间/forever> <理由> §7- §3修订封期。"
  "#version": "§2♡ 当前版本: {version} §7| §b模型: 魈 Xiao"

messages:
  get-kick-message: |-
    §b╔══════════════════════════╗
    §b║   §d魈的驱逐通知  §b║
    §b╠══════════════════════════╣
    §d☠️ 你被魈踢出服务器啦！
    
    §7原因: §f{reason}
    
    §d下次请遵守规则哦~
    §b╚══════════════════════════╝
  on-kick-success: |-
    §b✧ 魈说：§a{player} §e已被踢出！
    §b原因: §f{reason}
    §b维护风起地的和平！§b(◕‿◕✿)
  toggle-broadcast: "§b魈说：§a自动广播已经 {enabled}！ 想听就听，不想听就关！"
  reload-config: "§b魈说：§a配置重新加载完成！说不定能发现新东西！"
  add-ban: "§b魈说：§a{player} 已被封禁 {days}，原因是：{reason}！不守规矩，就别怪魈无情！"
  remove-ban: "§b魈说：§a{player} 已从封禁名单中移除。知错能改，就放过他们吧！"
  add-mute: "§b魈说：§a{player} 已被禁言，原因是：{reason}！让他们安静一会儿吧！"
  remove-mute: "§b魈说：§a{player} 的禁言已解除，可以继续说话了！"
  add-ban-ip: "§b魈说：§aIP {ip} 已被封禁 {days}，原因是：{reason}！别再捣乱了！"
  remove-ban-ip: "§b魈说：§aIP {ip} 的封禁已解除，放过他们吧！"
  add-warn: "§b魈说：§a玩家 §e{player} §a因 §6{reason} §a被记一次业障。业障缠身，请及时回头。"
  remove-warn: "§b魈说：§a玩家 {player} 的警告记录已移除。"
  mute-command-blocked: "§b魈说：§c禁言期间不能使用该命令。安静待着，别添乱。"
  warn-offline: "§b魈说：§a{player} 不在线，警告已记下，原因是：{reason}。等他回来再算账！"
  pending-warnings-notice: "§b魈说：§e你身上有 {count} 条待处理的业障，最好放在心上。"
  expiry-reminder: "§b魈说：§e{target} 的{type}还有 {remaining} 就要到期，别忘了处理。"
  escalated-ban: "§b魈说：§c{player} 第 {count} 次违规，已自动升级封禁 {duration}。屡教不改，就别怪魈无情！"
  alts-result: "§b魈说：§e查到 {player} 有 {count} 个同 IP 小号，都在魈的视线之内。"
  no-alts: "§b魈说：§a{player} 没有同 IP 小号，孤身一人，无可疑之处。"
  on-report-ban: "§b魈说：§a举报属实，{player} 已被封禁 {duration}。正义不会缺席！"
  export-result: "§b魈说：§a审计日志已导出，共 {count} 条记录。"
  sync-status: "§b魈说：§a跨服同步状态：§f{detail}"
  immunity-denied: "§b魈说：§c{target} 位阶在你之上，我不奉陪。"
  freeze-notify: "§c你已被管理员暂时冻结，理由：§f{reason}§c。别动。"
  freeze-title: "§c你已被冻结"
  freeze-subtitle: "§f理由：§e{reason}"
  freeze-reminder: "§c你正处于冻结状态。"
  on-freeze: "§a{player} 已被冻结，理由是：{reason}。"
  on-unfreeze: "§a{player} 已解冻。"
  on-vanish: "§a隐身已{state}。"
  rollback-preview: "§b魈说：§e{actor} 在 {time} 留了 {matched} 条可回滚的业障，要一并清除吗？"
  rollback-result: "§b魈说：§a业障已净。匹配 {matched} 条，执行 {executed} 条，跳过 {skipped} 条。"
  rollback-no-records: "§b魈说：§e{actor} 在那段时间并无业障，无需净化。"
  history-empty: "§b魈说：§a{player} 身上没有业障的气息……此人无需守护。"
  history-header: "{entry}"
  history-entry-format: "{entry}"
  history-footer: "§b魈说：§7这些业障我已记下。若再犯，我不会袖手旁观。"
  verify-result-valid: "§b魈说：§a校验通过，{count} 条记录完整无缺。"
  verify-result-invalid: "§b魈说：§c校验失败！检测到 {count} 条记录被篡改，有人动了手脚！"
