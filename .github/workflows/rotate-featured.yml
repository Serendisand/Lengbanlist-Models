name: 每月精选轮换

on:
  schedule:
    - cron: '0 0 1 * *'   # 每月 1 号 00:00 UTC
  workflow_dispatch: {}    # 可手动触发

permissions:
  contents: write

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 轮换 featured
        # 数据来自 bStats REST API；不填 Variables 时默认 33262 / modelUsage
        # 如需修改：Settings → Secrets and variables → Actions → Variables
        env:
          BSTATS_PLUGIN_ID: ${{ vars.BSTATS_PLUGIN_ID }}
          BSTATS_CHART_ID: ${{ vars.BSTATS_CHART_ID }}
        run: python3 .github/rotate_featured.py

      - name: 提交变更
        run: |
          git config user.name "Lengbanlist Bot"
          git config user.email "bot@lengbanlist-models.local"
          git add index.json
          git diff --cached --quiet || git commit -m "chore: 月度精选轮换 $(date -u +%Y-%m)"
          git push
